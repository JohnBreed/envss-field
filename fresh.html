<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D3A6A">
  <title>ENVSS Field</title>
  
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css?v=59">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register = function () { return Promise.resolve(); };
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches) caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
    }
  </script>

  <header class="app-header">
    <img src="vOSog.png" alt="Environmental Site Services" onerror="this.src='logo.svg'">
    <div class="titles">
      <h1>ENVSS Field</h1>
      <p id="whoLabel">Capture · offline first</p>
    </div>
    <div id="onlineDot" class="online-dot"></div>
  </header>
  <div id="loginGate" class="login-gate hidden">
    <div class="login-card">
      <h2>Sign in</h2>
      <p>Use your ENVSS Google account, or type your name.</p>
      <div id="googleBtn"></div>
      <label>Name</label>
      <input id="manualName">
      <label>Work email</label>
      <input id="manualEmail" placeholder="jane@envss.com.au">
      <div class="footer-actions">
        <button class="btn orange" onclick="manualLogin()">Continue</button>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script src="config.js?v=59"></script>
  <script src="https://cdn.jsdelivr.net/gh/JohnBreed/envss-field@138a583f7a75f3ba61024ec6c839080d8b46c33a/app.js"></script>
  <script src="catalogs-srs.js?v=59"></script>
  <script src="app-fibre.js?v=59"></script>
  <script src="app-fibre-v38.js?v=59"></script>
  <script src="app-fibre-v39.js?v=59"></script>
  <script src="app-fibre-v40.js?v=59"></script>
  <script src="app-fibre-v41.js?v=59"></script>
  <script src="app-fibre-v42.js?v=59"></script>
  <script src="app-fibre-v43.js?v=59"></script>
  <script src="app-fibre-v44.js?v=59"></script>
  <script src="app-fibre-v45.js?v=59"></script>
  <script src="app-fibre-v46.js?v=59"></script>
  <script src="app-fibre-v47.js?v=59"></script>
  <script src="app-fibre-v48.js?v=59"></script>
  <script src="app-fibre-v49.js?v=59"></script>
  <script src="app-fibre-v50.js?v=59"></script>
  <script src="app-fibre-v51.js?v=59"></script>
  <script src="app-fibre-v52.js?v=59"></script>
  <script src="app-fibre-v53.js?v=59"></script>
  <script src="app-fibre-v54.js?v=59"></script>
  <script src="app-fibre-v55.js?v=59"></script>
  <script src="app-fibre-v56.js?v=59"></script>
  <script src="app-fibre-v57.js?v=59"></script>
  <script src="app-fibre-v58.js?v=59"></script>
  
  <script>
    dashHtml = function () {
      var controllers = [], statuses = [];
      (db.projects || []).forEach(function (p) {
        if (p.source === "podio" && p.active === false) return;
        if (p.controller && controllers.indexOf(p.controller) === -1) controllers.push(p.controller);
        if (p.status && statuses.indexOf(p.status) === -1) statuses.push(p.status);
      });
      controllers.sort(); statuses.sort();
      if (!view.controller) view.controller = "all";
      if (!view.statusFilter) view.statusFilter = "all";
      var list = (db.projects || []).filter(function (p) {
        if (p.source === "podio" && p.active === false) return false;
        if (view.controller && view.controller !== "all" && p.controller !== view.controller) return false;
        if (view.statusFilter !== "all" && p.status !== view.statusFilter) return false;
        return true;
      }).sort(function (a, b) { return String(b.number || "").localeCompare(String(a.number || "")); });
      var html = "<div class=\"wrap\"><div class=\"row\"><h2 class=\"brand-type\" style=\"margin:0;color:var(--navy)\">Active projects</h2><button class=\"btn orange\" onclick=\"openNewProject()\">New project</button></div>";
      html += "<label>Controller</label><select id=\"controllerFilter\"><option value=\"all\">All controllers</option>";
      controllers.forEach(function (name) { html += "<option value=\"" + esc(name) + "\"" + (view.controller === name ? " selected" : "") + ">" + esc(name) + "</option>"; });
      html += "</select><label>Status</label><select id=\"statusFilter\"><option value=\"all\">All active statuses</option>";
      statuses.forEach(function (name) { html += "<option value=\"" + esc(name) + "\"" + (view.statusFilter === name ? " selected" : "") + ">" + esc(name) + "</option>"; });
      html += "</select><p class=\"help\">" + list.length + " active job" + (list.length === 1 ? "" : "s") + ".</p>";
      list.forEach(function (p) {
        html += "<div class=\"card\" onclick=\"openProject('" + p.id + "')\" style=\"cursor:pointer\"><div class=\"row\" style=\"align-items:flex-start\"><div class=\"grow\">";
        html += "<div class=\"brand-type\" style=\"font-weight:700;color:var(--navy);font-size:18px\">" + esc(p.name || p.number || "No title") + "</div>";
        html += "<div class=\"muted\">" + esc(p.number || "") + (p.client ? " · " + esc(p.client) : "") + (p.site ? " · " + esc(p.site) : "") + "</div>";
        html += "<div class=\"muted\">" + esc(p.controller || "No controller") + "</div></div>";
        html += "<div style=\"font-weight:700;color:var(--navy);text-align:right;max-width:160px\">" + esc(p.status || "No status") + "</div></div></div>";
      });
      html += "<p class=\"help\">ENVSS Field v59</p></div>";
      return html;
    };
    if (typeof bind === "function") {
      var _bind56 = bind;
      bind = function () {
        _bind56();
        var sel = document.getElementById("controllerFilter");
        if (sel) sel.onchange = function () { view.controller = sel.value; render(); };
        var st = document.getElementById("statusFilter");
        if (st) st.onchange = function () { view.statusFilter = st.value; render(); };
      };
    }
    
    newProjectHtml = function () {
      var statuses = ["New", "ENVSS to propose start date", "In Progress", "Awaiting Start Date/PO/Information from Client", "Lab Results Pending", "Report Pending", "Report in Review", "Overdue - Finish Today", "On Hold", "Closed", "Cancelled"];
      var opts = statuses.map(function (s) { return "<option value=\"" + esc(s) + "\"" + (s === "In Progress" ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("");
      return "<div class=\"wrap\"><button class=\"btn ghost\" onclick=\"goDash()\">← Projects</button><h2 class=\"brand-type\" style=\"color:var(--navy)\">New project</h2>" +
        "<label>Job number</label><input id=\"nnum\" placeholder=\"001900\">" +
        "<label>Project title</label><input id=\"nname\" placeholder=\"001900-Client-HYG-site\">" +
        "<label>Client</label><input id=\"nclient\" placeholder=\"Client\">" +
        "<label>Site</label><input id=\"nsite\" placeholder=\"Site address\">" +
        "<label>Status</label><select id=\"nstatus\">" + opts + "</select>" +
        "<label>Project controller</label><input id=\"ncontroller\" placeholder=\"Name\">" +
        "<label>Controller email</label><input id=\"ncontrollerEmail\" placeholder=\"name@envss.com.au\">" +
        "<label>Job type</label><input id=\"njobType\" value=\"HYG - Occupational Hygiene\">" +
        "<div class=\"footer-actions\"><button class=\"btn orange\" id=\"btnCreateProj\">Create project</button></div><p class=\"help\">ENVSS Field v59</p></div>";
    };
    createProject = function () {
      var num = ((document.getElementById("nnum") || {}).value || "").trim();
      var name = ((document.getElementById("nname") || {}).value || "").trim();
      var client = ((document.getElementById("nclient") || {}).value || "").trim();
      var site = ((document.getElementById("nsite") || {}).value || "").trim();
      var status = ((document.getElementById("nstatus") || {}).value || "In Progress").trim();
      var controller = ((document.getElementById("ncontroller") || {}).value || "").trim();
      var email = ((document.getElementById("ncontrollerEmail") || {}).value || "").trim();
      var jobType = ((document.getElementById("njobType") || {}).value || "").trim();
      if (!num) { alert("Enter a job number."); return; }
      if ((db.projects || []).some(function (x) { return x.number === num; })) { alert("That job number already exists."); return; }
      var inactive = status === "Closed" || status === "Cancelled" || status === "On Hold";
      var p = { id: uid("p"), source: "field", number: num, name: name || num, client: client, site: site, status: status, active: !inactive, controller: controller, controllerEmail: email, jobType: jobType };
      db.projects.push(p);
      save();
      openProject(p.id);
    };

    
    var _render57 = render;
    render = function () {
      if (view && view.page === "newProject") {
        view.newProjectDraft = view.newProjectDraft || {};
        ["nnum","nname","nclient","nsite","nstatus","ncontroller","ncontrollerEmail","njobType"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) view.newProjectDraft[id] = el.value;
        });
      }
      var ae = document.activeElement;
      var typing = view && view.page === "newProject" && ae && ae.closest && ae.closest("#app") && (ae.tagName === "INPUT" || ae.tagName === "SELECT");
      if (typing) return;
      _render57();
    };
    openNewProject = function () {
      view.page = "newProject";
      var ae = document.activeElement;
      if (ae && ae.blur) ae.blur();
      render();
    };
    var _pull57 = pullRemote;
    pullRemote = async function () {
      if (view && view.page === "newProject") return;
      await _pull57();
    };

    if (typeof render === "function") render();
  </script>

  <div id="v54banner" style="position:fixed;left:0;right:0;bottom:0;background:#2D3A6A;color:white;padding:8px 12px;z-index:9999;font-weight:700">ENVSS Field v59</div>
  <script>
    setInterval(function () {
      var b = document.getElementById("v54banner");
      if (b) b.textContent = "ENVSS Field v59";
    }, 500);
  </script>

  <script>
    openNewProject = function () {
      view.page = "newProject";
      var root = document.getElementById("app");
      if (root && typeof newProjectHtml === "function") {
        root.innerHTML = newProjectHtml();
        var btn = document.getElementById("btnCreateProj");
        if (btn) btn.onclick = function () { if (typeof createProject === "function") createProject(); };
        return;
      }
      if (typeof render === "function") render();
    };
  </script>

</body>
</html>
