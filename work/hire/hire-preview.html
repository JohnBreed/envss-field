<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENVSS hire request preview (not live)</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>

/* styles.css inlined (main @ 95a1dab) */
:root {
  --navy: #2D3A6A;
  --mid: #376396;
  --green: #4F8A7A;
  --orange: #D9782C;
  --ink: #4D4D4F;
  --line: #BBBCBE;
  --navy-30: #9A9CB9;
  --mid-30: #A2B4D1;
  --green-30: #C1D2CC;
  --orange-30: #F1D1B0;
  --bg: #F4F6F8;
  --card: #FFFFFF;
  --danger: #9B2C2C;
  --ok: #2F6F5E;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: Barlow, Arial, sans-serif; font-size: 16px; }
h1, h2, h3, .brand-type { font-family: Montserrat, Arial, sans-serif; }
button, input, select, textarea { font: inherit; }
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  box-shadow: 0 2px 8px rgba(45,58,106,.25);
}
.app-header img { height: 36px; background: #fff; border-radius: 4px; padding: 4px 6px; }
.app-header .titles { flex: 1; min-width: 0; }
.app-header h1 { margin: 0; font-size: 15px; letter-spacing: .02em; }
.app-header p { margin: 0; font-size: 11px; opacity: .8; }
.online-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green-30); }
.online-dot.off { background: var(--orange); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 14px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: var(--navy);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.card {
  background: var(--card); border: 1px solid #e4e7ec; border-radius: 12px;
  padding: 14px; margin-bottom: 10px;
}
.card h2 { margin: 0 0 8px; font-size: 16px; color: var(--navy); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 160px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--navy); margin: 8px 0 4px; }
input, select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff;
}
textarea { min-height: 80px; }
.btn {
  border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer;
  font-weight: 700; color: #fff; background: var(--navy);
}
.btn.mid { background: var(--mid); }
.btn.green { background: var(--green); }
.btn.orange { background: var(--orange); }
.btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); }
.btn.lg { min-height: 52px; font-size: 18px; flex: 1; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
}
.s-planned { background: #eef0f6; color: var(--navy); }
.s-prepped { background: var(--mid-30); color: var(--navy); }
.s-active, .s-running { background: var(--orange-30); color: #7a3e10; }
.s-complete, .s-ended { background: var(--green-30); color: var(--ok); }
.s-uploaded { background: var(--green); color: #fff; }
.s-rejected { background: #f8d7da; color: var(--danger); }
.train {
  display: grid; grid-template-columns: 64px 1fr auto;
  gap: 10px; align-items: center;
  border: 1px solid #e4e7ec; border-radius: 10px; padding: 10px; margin-top: 8px;
  cursor: pointer; background: #fff;
}
.train:hover { border-color: var(--mid); }
.pouch { font-family: Montserrat, Arial, sans-serif; font-weight: 700; color: var(--navy); font-size: 20px; }
.muted { color: #6b7280; font-size: 13px; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.startstop { display: flex; gap: 10px; margin-top: 12px; }
.combo { position: relative; }
.suggest {
  position: absolute; left: 0; right: 0; top: 100%; background: #fff;
  border: 1px solid var(--line); border-radius: 8px; z-index: 8;
  max-height: 180px; overflow: auto; display: none;
}
.suggest.on { display: block; }
.pump-note { font-size: 13px; color: #555; margin: 4px 0 0; }
.pump-warn { color: #a15c00; }
.suggest div { padding: 8px 10px; cursor: pointer; }
.suggest div:hover { background: var(--green-30); }
.footer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.empty { text-align: center; padding: 28px 10px; color: #6b7280; }
.login-gate {
  position: fixed; inset: 0; background: rgba(45,58,106,.88); z-index: 40;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.login-gate.hidden { display: none; }
.login-card {
  background: #fff; border-radius: 16px; padding: 22px; max-width: 420px; width: 100%;
}
.login-card h2 { margin: 0 0 8px; color: var(--navy); font-family: Montserrat, Arial, sans-serif; }
.google-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 320px; min-height: 48px; margin: 12px 0 6px; padding: 0 16px; background: #fff !important; color: #1f1f1f !important; border: 1px solid #747775; border-radius: 24px; font-family: Roboto, Arial, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; }
.google-btn:hover { background: #f2f6fc !important; }
.google-btn:disabled { opacity: .6; cursor: progress; }
.login-msg { color: #b3261e; font-weight: 600; margin: 8px 0 0; }
.login-msg.hidden { display: none; }
.check-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-weight: 600; }
.check-row input { width: auto; }
.comment-wrap { position: relative; }
.comment-wrap textarea { padding-right: 44px; }
.mic-btn {
  position: absolute; right: 8px; top: 8px; border: 0; background: transparent;
  width: 32px; height: 32px; padding: 0; cursor: pointer; color: var(--navy);
}
.mic-btn.live { color: var(--orange); }
.mic-bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; margin: 4px 0 8px; }
.mic-bars span { width: 3px; background: var(--orange); display: inline-block; min-height: 2px; }
.help { color: #6b7280; font-size: 12px; margin: 4px 0 10px; }

.train.tint-red { background: #fde8e8; }
.train.tint-amber { background: #fff4e0; }
.menu-wrap { position: relative; margin-left: auto; }
.menu {
  position: absolute; right: 0; top: 40px; background: #fff; border: 1px solid #d1d5db;
  border-radius: 10px; min-width: 180px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; cursor: pointer; }
.menu button:hover { background: #e8f0ee; }

.back { background: transparent; color: #fff; border: 0; cursor: pointer; font-weight: 700; }
@media (min-width: 800px) {
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}

.need-yn label { color: #b45309; }
.need-yn { background: #fff7ed; padding: 8px; border-radius: 10px; margin: 8px 0; }

.row-title { font-weight: 700; color: var(--navy); font-size: 16px; font-family: Montserrat, Arial, sans-serif; }

.dob-row { display: flex; gap: 6px; }
.dob-row input { width: 4.2em; text-align: center; }
.filters .chip { font-size: 12px; padding: 5px 9px; min-height: 0; }
.row-title { font-weight: 700; color: var(--navy) !important; font-size: 17px; font-family: Montserrat, Arial, sans-serif; }

.train.tint-green { background: #e7f6ee; }
.badge.s-sample_complete { background: #1F7A4D; color: #fff; }

.app-version{font-size:12px;opacity:.75;margin-left:6px;font-weight:400}
.sync-bar{font-size:12px;padding:6px 14px;background:#eef1f8;color:#2D3A6A;border-bottom:1px solid #d9deea}
.sync-bar.pending{background:#fff6e5}.sync-bar.warn{background:#fdecea}
.sync-link{background:none;border:0;color:#2D3A6A;text-decoration:underline;cursor:pointer;font-size:12px;padding:0 4px}
.sync-err{color:#8a5a00;margin-top:2px}.sync-warn{color:#b3261e;font-weight:700;margin-top:2px}


.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ .grid2 { grid-template-columns:1fr; } }
.help { font-size:13px; color:#6b6d73; margin:6px 0 10px; }
.muted { color:#6b6d73; font-size:13px; margin-top:2px; }
.footer-actions { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 8px; }
.preview-banner {
  background:#9B2C2C; color:#fff; text-align:center; padding:10px 14px; font-weight:700;
  position:sticky; top:0; z-index:30;
}
.preview-banner small { display:block; font-weight:500; opacity:.95; margin-top:4px; }
#whoLabel { font-size:12px; opacity:.85; }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function uid(prefix) {
  return (prefix || "id") + "-" + Math.random().toString(36).slice(2, 10);
}

function supplierName(id) {
  var s = (HIRE_CATALOG.suppliers || []).find(function (x) { return x.id === id; });
  return s ? s.name : id;
}
function itemsFor(id) { return (HIRE_CATALOG.items[id] || []).slice(); }
function eventsForHireProject(projectId) {
  if (!projectId) return [];
  return SAMPLE_EVENTS.filter(function (e) { return e.projectId === projectId; });
}
function hireEventLabel(jobNumber, e) {
  var type = (e && e.type === "fibre") ? "Airborne fibre monitoring" : "Hygiene event";
  var bits = [];
  if (jobNumber) bits.push(jobNumber);
  if (e && e.code) bits.push(e.code);
  if (type) bits.push(type);
  if (e && e.date) bits.push(e.date);
  return bits.join(" · ");
}
function logisticsLabel(v) {
  if (v === "delivery") return "Delivery";
  if (v === "pickup") return "Pickup";
  if (v === "already_holding") return "Already holding (kit kept between same-week jobs)";
  return v || "";
}

}

  html += "<label>Delivery address</label><input id=\"hireSite\" value=\"" + esc(d.delivery_site || "") + "\" placeholder=\"Never shown on hire-company emails or Xero POs\">";
  html += "<p class=\"help\">Internal only — stored for staff. Never put this address on hire-company emails or Xero POs. This preview does not send hire emails or create Xero POs.</p>";
  html += "<label>Who requested it</label><input id=\"hireWho\" value=\"" + esc(d.requested_by || "") + "\">";
  html += "<h3 class=\"brand-type\" style=\"color:var(--navy);font-size:16px;margin:18px 0 8px\">Equipment lines</h3>";
  html += "<div id=\"hireLines\">";
  (d.lines || [blankLine()]).forEach(function (ln, i) { html += lineHtml(ln, i, items); });
  html += "</div>";
  html += "<button type=\"button\" class=\"btn mid\" id=\"btnHireAddLine\">Add equipment line</button>";
  html += "<div class=\"footer-actions\">";
  html += "<button type=\"button\" class=\"btn orange\" id=\"btnHireSave\">" + (mode === "version" ? "Save as new version" : "Submit hire request") + "</button>";
  html += "<button type=\"button\" class=\"btn ghost\" id=\"btnHireCancel\">Cancel</button>";
  html += "</div></div>";
  return html;
}

function readDraftFromDom() {
  var d = view.hireDraft || blankDraft();
  var sup = document.getElementById("hireSupplier");
  if (sup) d.supplier = sup.value;
  var on = document.getElementById("hireOn");
  if (on) d.on_hire_date = on.value;
  var off = document.getElementById("hireOff");
  if (off) d.off_hire_date = off.value;
  var log = document.getElementById("hireLogistics");
  if (log) d.logistics = log.value;
  var site = document.getElementById("hireSite");
  if (site) d.delivery_site = site.value.trim();
  var who = document.getElementById("hireWho");
  if (who) d.requested_by = who.value.trim();
  if (d.ref_type === "job") {
    var job = document.getElementById("hireJob");
    if (job) {
      d.job_number = (job.value || "").trim();
      var opt = job.options[job.selectedIndex];
      d.project_id = opt && opt.getAttribute("data-pid") || "";
      d.lead_number = "";
    }
    var evSel = document.getElementById("hireEvent");
    if (evSel) {
      d.event_id = (evSel.value || "").trim();
      var eopt = evSel.options[evSel.selectedIndex];
      d.event_code = (eopt && eopt.getAttribute("data-code")) || "";
      d.event_date = (eopt && eopt.getAttribute("data-date")) || "";
    } else {
      d.event_id = "";
      d.event_code = "";
      d.event_date = "";
    }
  } else {
    var lead = document.getElementById("hireLead");
    if (lead) d.lead_number = lead.value.trim();
    d.job_number = "";
    d.project_id = "";
    d.event_id = "";
    d.event_code = "";
    d.event_date = "";
  }
  var lines = [];
  document.querySelectorAll("#hireLines .hire-line").forEach(function (card) {
    var eq = card.querySelector(".hire-equip");
    var lab = card.querySelector(".hire-label");
    var qty = card.querySelector(".hire-qty");
    var key = eq ? eq.value : "";
    var label = lab ? lab.value.trim() : "";
    var isFree = key === "__free__" || (!key && !!label);
    var catalogKey = isFree ? "" : key;
    var catIt = (!isFree && catalogKey) ? itemsFor(d.supplier).find(function (x) { return x.key === catalogKey; }) : null;
    if (!isFree && catIt && !label) label = catIt.label;
    lines.push({
      catalog_key: catalogKey,
      label: label,
      quantity: Math.max(1, parseInt(qty && qty.value, 10) || 1),
      is_free_text: isFree,
      flagged: isFree || !!(catIt && catIt.pending),
      catalog_code: catIt && catIt.catalog_code ? catIt.catalog_code : "",
      rates: catIt && catIt.rates ? catIt.rates : null,
      rateNote: catIt && catIt.rateNote ? catIt.rateNote : ""
    });
  });
  if (lines.length) d.lines = lines;
  view.hireDraft = d;
  return d;
}

function validate(d) {
  if (!d.supplier || !HIRE_CATALOG.suppliers.some(function (s) { return s.id === s.id && s.enabled && s.id === d.supplier; })) {
    return "Choose an enabled supplier (Air-Met, NVMS, ETS, or Mérieux).";
  }
  if (d.ref_type === "job") {
    if (!String(d.job_number || "").trim()) return "Pick a job from the demo project list.";
    if (!String(d.event_id || "").trim()) return "Pick the project event under this job.";
  } else if (d.ref_type === "lead") {
    if (!String(d.lead_number || "").trim()) return "Enter the unique lead number.";
  } else return "Choose Job or Lead.";
  if (!d.on_hire_date) return "Enter the on-hire date.";
  if (!d.off_hire_date) return "Enter the off-hire date.";
  if (d.off_hire_date < d.on_hire_date) return "Off-hire date must be on or after on-hire date.";
  if (!d.logistics) return "Choose logistics.";
  if (!d.requested_by) return "Who requested it is required.";
  if (!d.lines || !d.lines.length) return "Add at least one equipment line.";
  for (var i = 0; i < d.lines.length; i++) {
    if (!d.lines[i].label) return "Line " + (i + 1) + " needs a label.";
  }
  return "";
}

function paint() {
  var root = document.getElementById("app");
  if (view.page === "hireForm") root.innerHTML = hireFormHtml();
  else if (view.page === "hireList") root.innerHTML = listHtml();
  else root.innerHTML = dashHtml();
  bind();
}

function bind() {
  var b = document.getElementById("btnHireRequests");
  if (b) b.onclick = function () { view.page = "hireList"; paint(); };
  var back = document.getElementById("btnHireBackDash");
  if (back) back.onclick = function () { view.page = "dash"; paint(); };
  var neu = document.getElementById("btnHireNew");
  if (neu) neu.onclick = function () {
    view.hireMode = "new"; view.hireId = ""; view.hireDraft = blankDraft(); view.page = "hireForm"; paint();
  };
  var backL = document.getElementById("btnHireBackList");
  if (backL) backL.onclick = function () { view.page = "hireList"; paint(); };
  var cancel = document.getElementById("btnHireCancel");
  if (cancel) cancel.onclick = function () { view.page = "hireList"; paint(); };
  document.querySelectorAll(".open-hire").forEach(function (btn) {
    btn.onclick = function () {
      var id = btn.getAttribute("data-hire");
      var prev = db.hires.find(function (h) { return h.id === id; });
      if (!prev) return;
      view.hireMode = "version"; view.hireId = id; view.hireDraft = blankDraft(prev); view.page = "hireForm"; paint();
    };
  });
  document.querySelectorAll("[data-hire-ref]").forEach(function (chip) {
    chip.onclick = function () {
      readDraftFromDom();
      view.hireDraft.ref_type = chip.getAttribute("data-hire-ref");
      paint();
    };
  });
  var jobSel = document.getElementById("hireJob");
  if (jobSel) jobSel.onchange = function () {
    readDraftFromDom();
    view.hireDraft.event_id = "";
    view.hireDraft.event_code = "";
    view.hireDraft.event_date = "";
    paint();
  };
  var evSel = document.getElementById("hireEvent");
  if (evSel) evSel.onchange = function () { readDraftFromDom(); };
  var sup = document.getElementById("hireSupplier");
  if (sup) sup.onchange = function () {
    readDraftFromDom();
    (view.hireDraft.lines || []).forEach(function (ln) {
      ln.catalog_key = ""; ln.label = ""; ln.is_free_text = false; ln.flagged = false; ln.rateNote = "";
    });
    paint();
  };
  document.getElementById("btnHireAddLine") && (document.getElementById("btnHireAddLine").onclick = function () {
    readDraftFromDom();
    view.hireDraft.lines.push(blankLine());
    paint();
  });
  document.querySelectorAll(".hire-remove-line").forEach(function (btn) {
    btn.onclick = function () {
      readDraftFromDom();
      var i = parseInt(btn.getAttribute("data-line"), 10);
      view.hireDraft.lines.splice(i, 1);
      if (!view.hireDraft.lines.length) view.hireDraft.lines.push(blankLine());
      paint();
    };
  });
  function applyHireEquipFilter(input) {
    var q = (input.value || "").trim().toLowerCase();
    var card = input.closest(".hire-line");
    if (!card) return;
    var sel = card.querySelector("select.hire-equip");
    if (!sel) return;
    var group = null;
    var visibleInGroup = 0;
    function finishGroup() {
      if (group) {
        group.hidden = !!(q && visibleInGroup === 0);
        group = null;
        visibleInGroup = 0;
      }
    }
    Array.prototype.forEach.call(sel.children, function (node) {
      if (node.tagName === "OPTGROUP") {
        finishGroup();
        group = node;
        visibleInGroup = 0;
        Array.prototype.forEach.call(node.children, function (opt) {
          var show = !q || String(opt.textContent || "").toLowerCase().indexOf(q) !== -1;
          opt.hidden = !show;
          if (show) visibleInGroup += 1;
        });
      } else if (node.tagName === "OPTION") {
        finishGroup();
        if (!node.value || node.value === "__free__") {
          node.hidden = false;
        } else {
          node.hidden = !!(q && String(node.textContent || "").toLowerCase().indexOf(q) === -1);
        }
      }
    });
    finishGroup();
  }
  document.querySelectorAll(".hire-equip-search").forEach(function (inp) {
    inp.addEventListener("input", function () { applyHireEquipFilter(inp); });
    inp.addEventListener("focus", function () { applyHireEquipFilter(inp); });
  });
  document.querySelectorAll(".hire-equip").forEach(function (sel) {
    sel.onchange = function () {
      readDraftFromDom();
      paint();
    };
  });
  var save = document.getElementById("btnHireSave");
  if (save) save.onclick = function () {
    var d = readDraftFromDom();
    var err = validate(d);
    if (err) { alert(err); return; }
    if (view.hireMode === "version") {
      var prev = db.hires.find(function (h) { return h.id === view.hireId; });
      if (!prev) { alert("Original request missing."); return; }
      db.hires.forEach(function (h) {
        if (h.request_group_id === prev.request_group_id) h.is_latest = false;
      });
      var next = blankDraft(d);
      next.id = uid("hr");
      next.request_group_id = prev.request_group_id;
      next.version = (prev.version || 1) + 1;
      next.is_latest = true;
      db.hires.push(next);
    } else {
      var rec = blankDraft(d);
      rec.id = uid("hr");
      rec.request_group_id = uid("hg");
      rec.version = 1;
      rec.is_latest = true;
      db.hires.push(rec);
    }
    view.page = "hireList";
    paint();
  };
}

document.addEventListener("DOMContentLoaded", function () {
  var q = (location.search || "").replace(/^\?/, "");
  if (q.indexOf("page=form") >= 0) {
    view.page = "hireForm"; view.hireMode = "new"; view.hireDraft = blankDraft();
  } else if (q.indexOf("page=list") >= 0) {
    view.page = "hireList";
  }
  paint();
});

</script>
</body>
</html>
