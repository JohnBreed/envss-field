<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENVSS Field</title>
  <!-- Retired test copy. The ENVSS Field app now lives only at field.html; this page forwards there, keeping any ?query and #hash. -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { var w = r.active || r.waiting || r.installing; if (w && /\/sw-next\.js$/.test(w.scriptURL)) r.unregister(); });
      }).catch(function () {});
    }
    location.replace("field.html" + location.search + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=field.html"></noscript>
</head>
<body>
  <p><a href="field.html">Open ENVSS Field</a></p>
</body>
</html>
