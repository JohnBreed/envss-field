const WHO_KEY = "envss-field-operator";

function deviceLabel() {
  const ua = navigator.userAgent || "";
  if (/CrOS/i.test(ua)) return "Chromebook";
  if (/Android/i.test(ua)) return "Android";
  if (/iPhone|iPad/i.test(ua)) return "iOS";
  if (/Mac/i.test(ua)) return "Mac";
  if (/Win/i.test(ua)) return "Windows";
  return "Browser";
}
function getOperator() {
  try { return JSON.parse(localStorage.getItem(WHO_KEY) || "null"); } catch { return null; }
}
function setOperator(name, extra) {
  const rec = {
    name: (name || "").trim() || "Unknown",
    email: extra && extra.email ? extra.email : "",
    source: extra && extra.source ? extra.source : "manual",
    device: deviceLabel(),
    setAt: nowIso()
  };
  safeSetItem(WHO_KEY, JSON.stringify(rec));
  return rec;
}
function whoText() {
  const o = getOperator();
  if (!o) return deviceLabel();
  return o.email ? `${o.name} <${o.email}> · ${o.device}` : `${o.name} · ${o.device}`;
}
function allowedEmail(email) {
  const domain = (window.ENVSS_CONFIG && window.ENVSS_CONFIG.allowedDomain) || "envss.com.au";
  return String(email || "").toLowerCase().endsWith("@" + domain.toLowerCase());
}

/* ===== v45 sign-in: Google only, through Supabase Auth (PKCE redirect, no library) =====
   - The only way in is "Sign in with Google" -> Supabase /auth/v1/authorize?provider=google (hd=envss.com.au).
     Supabase's Before User Created hook refuses non-envss.com.au accounts; the Google OAuth client is Internal.
   - The Supabase session (access + refresh token) is kept in localStorage, so a device stays signed in,
     including offline. An expired access token never signs anyone out and never blocks capture: requests
     fall back to the public key during the dual-key period and the token refreshes when back online.
   - If Supabase refuses the refresh (user removed, sessions revoked) the sync bar asks to sign in again;
     queued changes and photos stay on the device.
   - "who" in audit entries comes from the Google account (user_metadata.full_name / email). */
const AUTH_KEY = "envss-field-auth-v45";
const PKCE_KEY = "envss-field-pkce-v45";
let authMsg = "";
let authBusy = false;
let refreshing = null;

function getSession() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { return null; }
}
function saveSession(sess) {
  if (sess) safeSetItem(AUTH_KEY, JSON.stringify(sess));
  else { try { localStorage.removeItem(AUTH_KEY); } catch (e) {} }
}
function hasSession() {
  const sess = getSession();
  return !!(sess && sess.refresh_token && sess.user && allowedEmail(sess.user.email));
}
function sessionInvalid() {
  const sess = getSession();
  return !!(sess && sess.invalid);
}
/* the current access token, or "" when there is none, it was refused, or it expires within 30 s */
function accessToken() {
  const sess = getSession();
  if (!sess || sess.invalid || !sess.access_token) return "";
  if ((Number(sess.expires_at) || 0) * 1000 <= Date.now() + 30e3) return "";
  return sess.access_token;
}
function userFromAuth(u) {
  if (!u) return null;
  const m = u.user_metadata || {};
  return { id: u.id || "", email: String(u.email || m.email || "").toLowerCase(), name: m.full_name || m.name || "" };
}
function sessionFrom(j, prevUser) {
  const now = Math.floor(Date.now() / 1000);
  return {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Number(j.expires_at) || (now + (Number(j.expires_in) || 3600)),
    user: userFromAuth(j.user) || prevUser || null,
    invalid: false,
    savedAt: nowIso()
  };
}
function authHeaders(extra) {
  const c = sbCfg();
  return Object.assign({ apikey: c.supabaseAnonKey, "Content-Type": "application/json" }, extra || {});
}
async function doRefresh(force) {
  const c = sbCfg();
  const cur = getSession();
  if (!c || !cur || !cur.refresh_token || cur.invalid) return false;
  /* another tab may have refreshed already (the refresh token rotates) */
  if (!force && (Number(cur.expires_at) || 0) * 1000 > Date.now() + 5 * 60e3) return true;
  let res;
  try {
    res = await fetch(c.supabaseUrl + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ refresh_token: cur.refresh_token })
    });
  } catch (e) { return false; }                     // offline / network: keep the session, try later
  if (res.ok) {
    const j = await res.json().catch(() => null);
    if (j && j.access_token && j.refresh_token) { saveSession(sessionFrom(j, cur.user)); return true; }
    return false;
  }
  if (res.status === 400 || res.status === 401 || res.status === 403) {
    /* a rotated token can lose a race with another tab: only give up if the stored token is still the one we sent */
    const now = getSession();
    if (now && now.refresh_token === cur.refresh_token) {
      now.invalid = true; now.invalidAt = nowIso(); saveSession(now);
      console.warn("[ENVSS] sign-in ended by the server (" + res.status + ")");
      try { paintSyncBar(); } catch (e) {}
      return false;
    }
    return !!(now && !now.invalid);
  }
  return false;                                       // 5xx etc: try again later
}
function refreshSession(force) {
  if (refreshing) return refreshing;
  const run = () => doRefresh(force);
  refreshing = (navigator.locks && navigator.locks.request
    ? navigator.locks.request("envss-field-auth-refresh", run)
    : run()).catch(() => false).finally(() => { refreshing = null; });
  return refreshing;
}
/* refresh when the access token is within 5 minutes of expiry (only when online) */
async function ensureFreshSession() {
  const sess = getSession();
  if (!sess || sess.invalid || !sess.refresh_token || !navigator.onLine) return;
  if ((Number(sess.expires_at) || 0) * 1000 > Date.now() + 5 * 60e3) return;
  await refreshSession(false);
}
/* Every Supabase data / storage call goes through here: signed-in session token when there is one,
   the public key otherwise (dual-key period). A 401 on a session token refreshes once and retries. */
async function sbFetch(url, init) {
  const c = sbCfg();
  const opts = Object.assign({}, init || {});
  const withAuth = () => {
    const h = Object.assign({}, opts.headers || {});
    const tok = accessToken();
    h.apikey = c.supabaseAnonKey;
    h.Authorization = "Bearer " + (tok || c.supabaseAnonKey);
    return { h, usedSession: !!tok };
  };
  try { await ensureFreshSession(); } catch (e) {}
  let a = withAuth();
  let res = await fetch(url, Object.assign({}, opts, { headers: a.h }));
  if (res.status === 401 && a.usedSession) {
    const ok = await refreshSession(true);
    if (ok) { a = withAuth(); res = await fetch(url, Object.assign({}, opts, { headers: a.h })); }
  }
  return res;
}
function b64url(bytes) {
  let str = "";
  bytes.forEach(b => { str += String.fromCharCode(b); });
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function startGoogleSignIn() {
  const c = sbCfg();
  if (!c) { alert("Supabase is not configured on this page."); return; }
  if (!navigator.onLine) { authMsg = "You're offline. Connect to the internet to sign in."; paintLogin(); return; }
  try { persist(); } catch (e) {}
  authBusy = true; authMsg = ""; paintLogin();
  try {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
    safeSetItem(PKCE_KEY, JSON.stringify({ verifier, at: Date.now() }));
    const domain = (window.ENVSS_CONFIG && window.ENVSS_CONFIG.allowedDomain) || "envss.com.au";
    const q = new URLSearchParams({
      provider: "google",
      redirect_to: location.origin + location.pathname,
      code_challenge: challenge,
      code_challenge_method: "s256",
      hd: domain,
      prompt: "select_account"
    });
    location.assign(c.supabaseUrl + "/auth/v1/authorize?" + q.toString());
  } catch (e) {
    authBusy = false; authMsg = "Could not start Google sign-in: " + (e && e.message || e); paintLogin();
  }
}
async function acceptSession(j) {
  const c = sbCfg();
  let sess = sessionFrom(j, null);
  if (!sess.user || !sess.user.email) {
    const r = await fetch(c.supabaseUrl + "/auth/v1/user", { headers: authHeaders({ Authorization: "Bearer " + sess.access_token }) });
    if (!r.ok) throw new Error("could not read the signed-in account (" + r.status + ")");
    sess.user = userFromAuth(await r.json());
  }
  if (!sess.user || !allowedEmail(sess.user.email)) {
    fetch(c.supabaseUrl + "/auth/v1/logout?scope=local", { method: "POST", headers: authHeaders({ Authorization: "Bearer " + sess.access_token }) }).catch(() => {});
    throw new Error("use your @" + ((window.ENVSS_CONFIG && window.ENVSS_CONFIG.allowedDomain) || "envss.com.au") + " Google account");
  }
  saveSession(sess);
  setOperator(sess.user.name || sess.user.email, { email: sess.user.email, source: "google" });
}
/* runs once at start-up: picks up ?code= (PKCE) or #access_token= (implicit) or an error from the Google round trip */
async function handleAuthRedirect() {
  const u = new URL(location.href);
  const hash = new URLSearchParams(u.hash.replace(/^#/, ""));
  const err = u.searchParams.get("error_description") || hash.get("error_description") || u.searchParams.get("error") || hash.get("error");
  const code = u.searchParams.get("code");
  const hashTok = hash.get("access_token");
  if (!err && !code && !hashTok) return;
  try { history.replaceState(null, "", u.pathname); } catch (e) {}   // tokens / code never stay in the address bar
  if (err) {
    try { localStorage.removeItem(PKCE_KEY); } catch (e) {}
    authMsg = "Sign-in was refused: " + String(err).replace(/\+/g, " ") + ". Use your @envss.com.au Google account.";
    paintLogin();
    return;
  }
  const c = sbCfg();
  authBusy = true; paintLogin();
  try {
    let j;
    if (code) {
      let pk = null;
      try { pk = JSON.parse(localStorage.getItem(PKCE_KEY) || "null"); } catch (e) {}
      try { localStorage.removeItem(PKCE_KEY); } catch (e) {}
      if (!pk || !pk.verifier) throw new Error("this sign-in was started in another browser or tab. Please try again");
      const res = await fetch(c.supabaseUrl + "/auth/v1/token?grant_type=pkce", {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ auth_code: code, code_verifier: pk.verifier })
      });
      j = await res.json().catch(() => ({}));
      if (!res.ok || !j.access_token) throw new Error(j.error_description || j.msg || j.message || ("token " + res.status));
    } else {
      j = { access_token: hashTok, refresh_token: hash.get("refresh_token"), expires_in: hash.get("expires_in"), expires_at: hash.get("expires_at") };
      if (!j.refresh_token) throw new Error("no refresh token returned");
    }
    await acceptSession(j);
    authMsg = "";
  } catch (e) {
    authMsg = "Sign-in failed: " + (e && e.message || e) + ".";
  } finally {
    authBusy = false;
  }
  try { paintLogin(); render(); } catch (e) {}
  if (hasSession()) {
    try { scheduleFlush(100); } catch (e) {}
    try { pullRemote(); } catch (e) {}

function rejectList(t) { return isNoise(t) ? noiseRejects() : REJECTS; }

const PODIO_FIELDS = [["number", "Project number"], ["name", "Project name"], ["client", "Client"], ["site", "Site"], ["status", "Status"], ["controller", "Project controller"], ["controllerEmail", "Controller email"], ["jobType", "Job type"]];
function podioProjectReadOnlyHtml(p) {
  return `<div class="card podio-readonly" id="podioReadOnly">
      <div class="muted" style="margin-bottom:6px">From Podio (read-only). Change these in Podio.</div>
      ${PODIO_FIELDS.map(([k, label]) => `<label>${label}</label><input data-podio-field="${k}" value="${esc(p[k] || "")}" readonly disabled>`).join("")}
    </div>`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"\x26amp;","<":"\x26lt;",">":"\x26gt;","\"":"\x26quot;","'":"\x26#39;"}[c]));
}

function audit(t, action, detail) {
  t.audit = t.audit || [];
  t.audit.push({ at: nowIso(), action, detail: detail || "", who: whoText() });
}

function bind() {
  document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { view.filter = b.dataset.filter; render(); });
  const menuBtn = document.getElementById("btnMenu");
  const menu = document.getElementById("eventMenu");
  if (menuBtn && menu) menuBtn.onclick = ev => { ev.stopPropagation(); menu.hidden = !menu.hidden; };
  const sMenuBtn = document.getElementById("btnSampleMenu");
  const sMenu = document.getElementById("sampleMenu");
  if (sMenuBtn && sMenu) sMenuBtn.onclick = ev => { ev.stopPropagation(); sMenu.hidden = !sMenu.hidden; };
  const auditToggle = document.getElementById("auditToggle");
  const auditBox = document.getElementById("auditBox");
  if (auditToggle && auditBox) auditToggle.onclick = () => {
    auditBox.hidden = !auditBox.hidden;
    auditToggle.textContent = auditBox.hidden ? "Audit log ▸" : "Audit log ▾";
  };
  const saveEv = document.getElementById("btnSaveEv");
  if (saveEv) saveEv.onclick = saveEventEdits;
  const t = db.trains.find(x => x.id === view.trainId);
  if (view.page === "train" && t) {
    const names = db.catalogs.contaminants.map(c => c.code + " — " + c.name);
    wireCombo("contam", names, (val) => {
      const code = val.split("—")[0].trim().toUpperCase();
      let c = db.catalogs.contaminants.find(x => x.code === code || x.name.toLowerCase() === val.toLowerCase());
      if (!c) {
        c = { id: code || uid("c"), name: val, code: code || val.slice(0,3).toUpperCase(), headHint: "", flowTolPct: 5, defaultFlow: "" };
        db.catalogs.contaminants.push(c);
      }
      t.contaminantId = c.id;
      /* start flow stays empty until typed */
      if (c.minMinutes && !t.minMinutes) t.minMinutes = String(c.minMinutes);
      if (c.desiredVolumeL && !t.desiredVolumeL) t.desiredVolumeL = String(c.desiredVolumeL);
    });
    wireCombo("pump", (db.catalogs.pumps || []).map(p => p.serial), (val) => { t.pumpSerial = val.trim(); });
    wireCombo("head", (db.catalogs.heads || []).map(h => h.id), (val) => { t.headId = val.trim().toUpperCase(); });
    wireCombo("dosimeter", (db.catalogs.dosimeters || []).map(d => d.serial), (val) => { t.dosimeterSerial = val.trim(); });
    wireCombo("occupation", db.catalogs.occupations || [], (val) => { t.person = t.person || {}; t.person.occupation = val; });
    document.querySelectorAll("[data-shift]").forEach(b => b.onclick = () => {
      t.shiftKind = b.dataset.shift;
      audit(t, "Shift", shiftLabel(t));
      save();
    });
    document.querySelectorAll("[data-yn]").forEach(b => b.onclick = () => {
      const field = b.dataset.yn, val = b.dataset.val;
      const cur = field === "reject" ? t.rejectAsked : field === "equip" ? t.equipAsked : field === "rpd" ? t.rpdAsked : field === "hpd" ? t.hpdAsked : t.commentAsked;
      const next = cur === val ? "" : val;
      if (field === "reject") {
        t.rejectAsked = next;
        if (next !== "yes") { t.rejectCode = ""; if (t.status === "rejected" || t.status === "fault") t.status = t.endAt ? "ended" : t.status; }
        if (next === "yes" && t.endAt) t.status = isNoise(t) ? "fault" : "rejected";
      }
      if (field === "equip") { t.equipAsked = next; t.equipDamaged = next === "yes"; }
      if (field === "comment") t.commentAsked = next;
      if (field === "rpd") { t.rpdAsked = next; t.rpd = t.rpd || {}; t.rpd.worn = next; }
      if (field === "hpd") { t.hpdAsked = next; t.hpd = t.hpd || {}; t.hpd.worn = next; }
      /* v40: the answer change is logged by the audit diff ("Changed <question>: old → new") */
      save();
    });
    document.querySelectorAll("[data-rej]").forEach(b => b.onclick = () => {
      if (t.rejectCode === b.dataset.rej) {
        t.rejectCode = "";
        t.rejectReason = "";
      } else {
        t.rejectCode = b.dataset.rej;
        t.rejectReason = rejectList(t).find(r => r.code === t.rejectCode)?.label || "";
        t.status = isNoise(t) ? "fault" : "rejected";
      }
      save();
    });
    const rejectedOn = document.getElementById("rejectedOn");
    if (rejectedOn) rejectedOn.onchange = () => {
      const box = document.getElementById("rejectBox");
      if (rejectedOn.checked) {
        if (box) box.style.display = "";
      } else {
        t.rejectCode = "";
        t.rejectReason = "";
        if (t.status === "rejected") t.status = t.endAt ? "ended" : (t.startAt ? "running" : "prepped");
        audit(t, "Reject cleared", "");
        save();
      }
    };
    const equipDamaged = document.getElementById("equipDamaged");
    if (equipDamaged) equipDamaged.onchange = () => {
      const box = document.getElementById("equipBox");
      t.equipDamaged = equipDamaged.checked;
      if (box) box.style.display = t.equipDamaged ? "" : "none";
      if (!t.equipDamaged) save();
    };
    const rpdOn = document.getElementById("rpdOn");
    if (rpdOn) rpdOn.onchange = () => {
      const box = document.getElementById("rpdBox");
      if (box) box.style.display = rpdOn.checked ? "" : "none";
    };
    const hpdOn = document.getElementById("hpdOn");
    if (hpdOn) hpdOn.onchange = () => {
      const box = document.getElementById("hpdBox");
      if (box) box.style.display = hpdOn.checked ? "" : "none";
    };
    const mineOn = document.getElementById("mineOn");
    if (mineOn) mineOn.onchange = () => {
      t.mineCodesOn = mineOn.checked;
      const box = document.getElementById("mineBox");
      if (box) box.style.display = t.mineCodesOn ? "" : "none";
      saveQuiet();
    };
    const methodOn = document.getElementById("methodOn");
    if (methodOn) methodOn.onchange = () => {
      t.methodOn = methodOn.checked;
      const box = document.getElementById("methodBox");
      if (box) box.style.display = t.methodOn ? "" : "none";
      if (!t.methodOn) { t.desiredVolumeL = ""; t.minMinutes = ""; }
      audit(t, "Method minimum", t.methodOn ? "on" : "off");
      save();
    };
    const kindSel = document.getElementById("trainKind");
    if (kindSel) kindSel.onchange = () => {
      collectTrain(t);
      applyTrainKind(t, kindSel.value);
      audit(t, "Train type changed", t.trainKind);
      save();
    };
    const equipPhoto = document.getElementById("equipPhoto");
    if (equipPhoto) equipPhoto.onchange = () => {
      const f = equipPhoto.files && equipPhoto.files[0];
      if (!f) return;
      /* v44d: shrunk, kept in IndexedDB and uploaded to the private field-photos bucket; the record keeps a reference only */
      envssPhotos.attach(f, t, "equipPhoto").then(v => { t.equipPhoto = v; t.equipDamaged = true; audit(t, "Equipment damage photo", nowIso()); save(); });
    };
    const speak = document.getElementById("btnSpeak");
    if (speak) speak.onclick = () => startSpeech();
    const photo = document.getElementById("photo");
    if (photo) photo.onchange = () => {
      const f = photo.files && photo.files[0];
      if (!f) return;
      envssPhotos.attach(f, t, "photo").then(v => { t.photo = v; audit(t, "Photo attached", "damaged filter"); save(); });   /* v44d */
    };
    const stopBtn = document.getElementById("btnStop");
    if (stopBtn) stopBtn.onclick = () => {
      collectTrain(t);
      const mins = (() => {
        const start = t.startAt ? new Date(t.startAt) : new Date();
        return (Date.now() - start) / 60000;
      })();
      const vol = volumeLitres({ ...t, endAt: nowIso() });
      const needM = parseFloat(t.minMinutes || "");
      const needV = parseFloat(t.desiredVolumeL || "");
      let warn = "";
      if (Number.isFinite(needM) && mins < needM) warn = `Runtime about ${mins.toFixed(0)} min is under the method minimum of ${needM} min.`;
      if (Number.isFinite(needV) && vol != null && vol < needV) warn += ` Volume about ${vol.toFixed(0)} L is under the desired ${needV} L.`;
      if (warn && !confirm(warn + " Stop anyway? This is logged.")) return;
      const prev = t.endAt;
      t.endAt = nowIso();
      t.status = "ended";
      audit(t, "STOP pressed", (prev ? `previous stop ${fmtTime(prev)}` : "") + (warn ? " · early-stop confirmed" : ""));
      const chk = flowCheck(t);
      if (!chk.ok) audit(t, "Flow outside tolerance", `${chk.pct.toFixed(1)}% vs ±${chk.tol}%`);
      save();
      captureLocation().then(loc => {
        if (!loc) { audit(t, "Stop location", "no fix"); save(); return; }
        t.endLoc = loc;
        audit(t, "Stop location", loc.lat.toFixed(5) + ", " + loc.lng.toFixed(5));
        save();
      });
    };
    const startBtn = document.getElementById("btnStart");
    if (startBtn) startBtn.onclick = () => {
      if (isStoppedTrain(t)) { alert("This sample has been stopped. Edit the start/stop times below if they were wrong."); return; }
      collectTrain(t);
      const gaps = startGaps(t);
      if (gaps.length) { alert("Cannot start until these are filled:\n• " + gaps.join("\n• ")); return; }
      const prev = t.startAt;
      t.startAt = nowIso();
      t.status = "running";
      audit(t, "START pressed", prev ? `previous start ${fmtTime(prev)}` : "");
      save();
      captureLocation().then(loc => {
        if (!loc) { audit(t, "Start location", "no fix"); save(); return; }
        t.startLoc = loc;
        audit(t, "Start location", loc.lat.toFixed(5) + ", " + loc.lng.toFixed(5));
        save();
      });
    };
    bindAutosave(t);
    const rejBtn = document.getElementById("btnReject");
    if (rejBtn) rejBtn.onclick = () => {
      collectTrain(t);
      if (!t.rejectCode) {
        alert("Tick Sample rejected and pick a reason first.");
        return;
      }
      t.status = "rejected";
      audit(t, "Rejected", t.rejectCode);
      save();
    };
    const delBtn = document.getElementById("btnDelete");
    if (delBtn) delBtn.onclick = () => deleteTrain(t);
    const ur = document.getElementById("btnUnreject");
    if (ur) ur.onclick = () => { collectTrain(t); t.status = t.endAt ? "ended" : (t.startAt ? "running" : "prepped"); audit(t, "Reject cleared"); save(); };
    const up = document.getElementById("btnUploaded");
    if (up) up.onclick = () => { collectTrain(t); t.status = "uploaded"; audit(t, "Marked uploaded"); save(); };
    const addPump = document.getElementById("btnAddPump");
    if (addPump) addPump.onclick = () => {
      collectTrain(t);
      if (isNoise(t)) {
        const s = t.dosimeterSerial;
        if (s && !(db.catalogs.dosimeters || []).some(d => d.serial === s)) {
          db.catalogs.dosimeters = db.catalogs.dosimeters || [];
          db.catalogs.dosimeters.push({ serial: s }); audit(t, "Dosimeter added to fleet", s); save();
          alert("Dosimeter " + s + " added.");
        }
        return;
      }
      if (t.pumpSerial && !db.catalogs.pumps.some(p => p.serial === t.pumpSerial)) {
        db.catalogs.pumps.push({ serial: t.pumpSerial }); audit(t, "Pump added to fleet", t.pumpSerial); save();
        alert("Pump " + t.pumpSerial + " added to fleet list.");
      }
    };
    const addHead = document.getElementById("btnAddHead");
    if (addHead) addHead.onclick = () => {
      collectTrain(t);
      const id = (t.headId || "").toUpperCase();
      if (id && !db.catalogs.heads.some(h => h.id === id)) {
        const kind = id.startsWith("RESS") ? "respirable" : id.startsWith("IESS") ? "inhalable" : id.startsWith("DP") ? "diesel" : "other";
        db.catalogs.heads.push({ id, kind }); audit(t, "Cassette added", id); save();
        alert("Cassette " + id + " added.");
      }
    };
    ["startFlow","endFlow","startAt","endAt"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("change", () => { collectTrain(t); render(); });
    });
  }
  const ce = document.getElementById("btnCreateEv");
  if (ce) ce.onclick = createEvent;
  const cp = document.getElementById("btnCreateProj");
  if (cp) cp.onclick = createProject;
}

function snapshotTrain(t) {
  return JSON.stringify({
    pouch: t.pouch, sampleNo: t.sampleNo, contaminantId: t.contaminantId, pumpSerial: t.pumpSerial,
    dosimeterSerial: t.dosimeterSerial, headId: t.headId, mediaId: t.mediaId, startFlow: t.startFlow,
    endFlow: t.endFlow, comments: t.comments, location: t.location, person: t.person, rpd: t.rpd, hpd: t.hpd,
    rejectCode: t.rejectCode, startAt: t.startAt, endAt: t.endAt, desiredVolumeL: t.desiredVolumeL,
    rotameter: t.rotameter, fieldCalibrator: t.fieldCalibrator
  });
}
function bindAutosave(t) {
  const root = document.getElementById("app");
  if (!root) return;
  root.querySelectorAll("input, textarea, select").forEach(el => {
    if (el.type === "file" || el.id === "rejectedOn" || el.id === "equipDamaged" || el.id === "rpdOn" || el.id === "hpdOn" || el.id === "trainKind") return;
    const persist = () => {
      collectTrain(t);
      saveQuiet();
    };
    el.addEventListener("change", persist);
    el.addEventListener("blur", persist);
  });
}
function captureLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, at: nowIso() }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 }
    );
  });
}

function collectTrain(t) {
  const g = id => document.getElementById(id);
  t.pouch = g("pouch")?.value.trim() || t.pouch;
  const sn = parseInt(t.pouch, 10);
  if (Number.isFinite(sn)) t.sampleNo = sn;
  if (isBlank(t) && (t.contaminantId || t.headId)) t.status = "field_blank";
  t.pumpSerial = g("pump")?.value.trim() || "";
  t.headId = (g("head")?.value || "").trim().toUpperCase();
  t.mediaId = g("media")?.value.trim() || "";
  t.startFlow = g("startFlow")?.value || "";
  t.endFlow = g("endFlow")?.value || "";
  t.mode = g("mode")?.value || t.mode;
  t.comments = g("comments")?.value || "";
  t.rejectReason = g("rejectReason")?.value || "";
  t.dosimeterSerial = g("dosimeter")?.value.trim() || t.dosimeterSerial || "";
  if (g("rotameter")) t.rotameter = g("rotameter").value.trim();            /* v44 */
  if (g("fieldCal")) t.fieldCalibrator = g("fieldCal").value.trim();        /* v44 */
  t.desiredVolumeL = g("desiredVolume")?.value || t.desiredVolumeL || "";
  t.minMinutes = g("minMinutes")?.value || t.minMinutes || "";
  if (g("sex") || g("first")) {
    t.person = t.person || {};
    t.person.sex = g("sex")?.value || t.person.sex || "";
  }
  t.rpd = {
    worn: t.rpdAsked || t.rpd?.worn || "",
    model: g("rpdModel")?.value || t.rpd?.model || "",
    shaven: g("rpdShaven")?.checked ? "yes" : (g("rpdShaven") ? "no" : (t.rpd?.shaven || "")),
    fit: g("rpdFit")?.checked ? "yes" : (g("rpdFit") ? "no" : (t.rpd?.fit || ""))
  };
  t.hpd = {
    worn: t.hpdAsked || t.hpd?.worn || "",
    model: g("hpdModel")?.value || t.hpd?.model || "",
    style: g("hpdStyle")?.value || t.hpd?.style || "",
    classRating: g("hpdClass")?.value || t.hpd?.classRating || ""
  };
  t.equipDamaged = !!(g("equipDamaged") && g("equipDamaged").checked);
  t.equipNote = g("equipNote")?.value || t.equipNote || "";
  const sd = g("shiftDate")?.value || t.shiftDate || "";
  if (g("startAt") && g("startAt").value) t.startAt = combineShiftTime(sd, g("startAt").value, false);
  if (g("endAt") && g("endAt").value) t.endAt = combineShiftTime(sd, g("endAt").value, true, g("startAt")?.value || toLocalInput(t.startAt));
  if (t.mode === "static") t.location = g("location")?.value || "";
  else {
    const dd = (g("dobD")?.value || "").replace(/\D/g,"");
    const mm = (g("dobM")?.value || "").replace(/\D/g,"");
    const yy = (g("dobY")?.value || "").replace(/\D/g,"");
    const dob = (yy.length===4 && dd && mm) ? (yy+"-"+mm.padStart(2,"0")+"-"+dd.padStart(2,"0")) : (t.person?.dob || "");
    t.person = {
      first: g("first")?.value || "", last: g("last")?.value || "", sex: g("sex")?.value || "",
      dob, dobD: dd, dobM: mm, dobY: yy,
      occupation: g("occupation")?.value || "", company: g("company")?.value || "",
      hours: g("hours")?.value || "", daysOn: g("daysOn")?.value || "", daysOff: g("daysOff")?.value || "",
      occupationCode: g("occCode")?.value || t.person?.occupationCode || ""
    };
  }
  t.seg = g("seg")?.value || t.seg || "";
  t.occupationCode = g("occCode")?.value || t.occupationCode || "";
  t.locationCode = g("locCode")?.value || t.locationCode || "";
  t.irsstCat = g("irsst")?.value || t.irsstCat || "";
  t.shiftDate = g("shiftDate")?.value || t.shiftDate || "";
  t.updatedAt = new Date().toISOString();
}

function wireCombo(inputId, items, onPick) {
  if (inputId === "pump") return wirePumpPicker(onPick);
  const input = document.getElementById(inputId);
  const box = document.getElementById("sug-" + inputId);
  if (!input || !box) return;
  const show = () => {
    const q = input.value.toLowerCase();
    const hits = items.filter(x => x.toLowerCase().includes(q)).slice(0, 8);
    box.innerHTML = hits.map(h => `<div data-v="${esc(h)}">${esc(h)}</div>`).join("") +
      (q && !items.some(x => x.toLowerCase() === q) ? `<div data-v="${esc(input.value)}"><em>Add “${esc(input.value)}”</em></div>` : "");
    box.classList.add("on");
    box.querySelectorAll("div").forEach(d => d.onclick = () => { input.value = d.dataset.v; onPick(d.dataset.v); box.classList.remove("on"); });
  };
  input.addEventListener("input", show);
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(() => box.classList.remove("on"), 180));
}

/* v37 pump picker: type-ahead by serial, ENVSS fleet first, hire pumps after, one-off pumps (local only) last. */
function allPumps() {
  const fleet = (db.catalogs.fleetPumps || []).slice().sort((a, b) => (a.sort_group - b.sort_group) || String(a.serial).localeCompare(String(b.serial), undefined, { numeric: true }));
  const seen = new Set(fleet.map(p => String(p.serial)));
  const local = (db.catalogs.pumps || []).filter(p => p && p.serial && !seen.has(String(p.serial))).map(p => ({ serial: p.serial, owner: "", local: true }));
  return fleet.concat(local);
}
function pumpInfo(p) {
  if (!p) return "";
  if (p.local) return "Added in app (not in Podio)";
  const mm = [p.make, p.model].filter(Boolean).join(" ");
  const own = p.owner === "ENVSS" ? "ENVSS" : "Hire - " + (p.owner || "unknown owner");
  return [own, mm].filter(Boolean).join(" · ");
}
function pumpWarn(p) {
  if (!p || p.local) return "";
  const w = [];
  if (/not calibrated/i.test(p.status || "")) w.push("Podio says Not Calibrated");
  if (p.calibration_due && p.calibration_due < new Date().toISOString().slice(0, 10)) w.push("calibration due " + p.calibration_due + " has passed");
  return w.length ? "Check pump: " + w.join("; ") + "." : "";
}
function wirePumpPicker(onPick) {
  const input = document.getElementById("pump");
  const box = document.getElementById("sug-pump");
  if (!input || !box) return;
  let note = document.getElementById("pumpNote");
  if (!note) { note = document.createElement("div"); note.id = "pumpNote"; note.className = "pump-note"; (input.closest(".combo") || input).insertAdjacentElement("afterend", note); }
  const paint = () => {
    const p = allPumps().find(x => String(x.serial) === input.value.trim());
    const w = pumpWarn(p);
    note.innerHTML = input.value.trim() ? (p ? esc(pumpInfo(p)) : "Not in the pump list") + (w ? `<div class="pump-warn">⚠ ${esc(w)}</div>` : "") : "";
  };
  const show = () => {
    const q = input.value.trim().toLowerCase();
    const list = allPumps();
    const hits = list.filter(x => String(x.serial).toLowerCase().includes(q)).slice(0, 12);
    box.innerHTML = hits.map(h => `<div data-v="${esc(h.serial)}"><b>${esc(h.serial)}</b> <small class="muted">${esc(pumpInfo(h))}${pumpWarn(h) ? " ⚠" : ""}</small></div>`).join("") +
      (q && !list.some(x => String(x.serial).toLowerCase() === q) ? `<div data-v="${esc(input.value.trim())}" data-new="1"><em>Add “${esc(input.value.trim())}” as a one-off pump</em></div>` : "");
    box.classList.add("on");
    box.querySelectorAll("div[data-v]").forEach(d => d.onmousedown = d.onclick = (ev) => {
      ev.preventDefault();
      input.value = d.dataset.v;
      if (d.dataset.new && !(db.catalogs.pumps || []).some(p => p.serial === d.dataset.v)) { db.catalogs.pumps = db.catalogs.pumps || []; db.catalogs.pumps.push({ serial: d.dataset.v }); persist(); }
      onPick(d.dataset.v); box.classList.remove("on"); paint();
    });
  };
  input.addEventListener("input", () => { show(); paint(); });
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(() => { box.classList.remove("on"); onPick(input.value); paint(); }, 180));
  paint();
}
function leaveSample(trainId, eventId) {
  const t = db.trains.find(x => x.id === trainId);
  if (t) { collectTrain(t); commit(); }
  openEvent(eventId);
}

function openProject(id) { view.page = "project"; view.projectId = id; render(); }

function openNewEvent(projectId) { view.page = "newEvent"; if (projectId) view.projectId = projectId; render(); }
function openEditEvent(id) { view.page = "editEvent"; view.eventId = id; render(); }
function markEventUpload(id) {
  const ev = eventById(id);
  if (!ev) return;
  const bad = trainsOf(id).filter(t => {
    if (isBlank(t)) return !blankComplete(t);

      const piece = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) {
        if (i >= (r._finalCount || 0)) finalText += (finalText ? " " : "") + piece;

    }
    r._finalCount = [...ev.results].filter(x => x.isFinal).length;
    const base = box.dataset.base || "";
    box.value = [base, finalText, interim].filter(Boolean).join(" ").replace(/\s+/g, " ");
  };

    recHold = null;
    stopMicUi(btn, bars);

  r.start();

function srs() { return window.ENVSS_SRS_CATALOGS || {}; }

function srsHits(kind, q) {
  const s = String(q || "").trim().toLowerCase();
  const list = srsList(kind);
  if (!s) return list.slice(0, 12);
  return list.filter(o => String(o.code).indexOf(s) === 0 || (o.name || "").toLowerCase().indexOf(s) !== -1 ||
    (o.parentName || "").toLowerCase().indexOf(s) !== -1 || (o.majorGroup || o.division || "").toLowerCase().indexOf(s) !== -1).slice(0, 12);
}
function srsFind(kind, val) {
  const s = String(val || "").trim();
  if (!s) return null;

function wireSrs(inputId, kind, onPick) {
  const input = document.getElementById(inputId);
  const box = document.getElementById("sug-" + inputId);
  if (!input || !box) return;
  const show = () => {
    box.innerHTML = srsHits(kind, input.value).map(o => `<div data-v="${esc(o.code + " — " + o.name)}">${esc(o.code + " — " + o.name)}</div>`).join("");
    box.classList.add("on");
    box.querySelectorAll("div").forEach(d => d.onmousedown = e => { e.preventDefault(); input.value = d.dataset.v; box.classList.remove("on"); onPick(d.dataset.v); });

    : minesChips("emines", minesState(ev)) + multiChips("emulti", ev.multiDay ? "yes" : "no")
      + `<label>Lab turnaround (COC)</label><select id="eturn">${optsHtml(window.COC_TAT_OPTS || [["standard", "Standard"]], ev.turnaround || "standard")}</select>`;   /* v45b */
  let out = html.replace("<label>Notes</label>", extra + "<label>Notes</label>");
  /* v36: the old multi-day checkbox is replaced by the Yes/No question (hygiene) or dropped (AFM is single shift). */
  out = out.replace(/<label class="check-row"><input type="checkbox" id="emulti"[^>]*>[^<]*<\/label>/, "");
  return out;
};
saveEventEdits = function () {
  const ev = eventById(view.eventId);
  const p = ev && project(ev.projectId);
  if (!ev || !p) return;
  const g = id => document.getElementById(id);
  if (!isPodioProject(p) && g("enum")) {   // v33: Podio project fields are never edited here
    p.number = g("enum").value.trim() || p.number;
    p.name = g("ename").value.trim();
    p.site = g("esite").value.trim();
  }
  ev.date = g("edate").value;
  ev.notes = g("enotes").value;
  if (isFibreEvent(ev)) {
    const seq = fibreSeqOf(ev.code) || nextFibreSeq(ev.projectId);
    ev.protocol = (g("eprotocol") || {}).value || ev.protocol || "background";
    ev.taskDesc = ((g("etask") || {}).value || "").trim();
    ev.tat = (g("etat") || {}).value || ev.tat || "next_0700";
    setEventRotameter(ev.id, (g("erota") || {}).value || "");
    trainsOf(ev.id).forEach(t => { if (!isBlank(t)) t.monitorType = ev.protocol; });
    ev.code = fibreEventCode(p, ev.date, seq);
  } else {
    if (g("emulti")) ev.multiDay = g("emulti").value === "yes";
    if (g("emines")) ev.minesAct = g("emines").value === "yes";
    if (g("eturn")) ev.turnaround = g("eturn").value || "standard";   /* v45b: Form 302 turnaround */
    const parts = ev.code.split("-");
    if (parts.length >= 2) ev.code = p.number + "-" + parts.slice(1).join("-");
  }
  save();
  openEvent(ev.id);
};

const _markEventUpload33 = markEventUpload;
markEventUpload = function (id) {
  const ev = eventById(id);
  if (!isFibreEvent(ev)) return _markEventUpload33(id);
  const bad = trainsOf(id).filter(t => !followUpComplete(t));
  if (bad.length) { alert("This event cannot be marked complete until all samples are complete.\nIncomplete: " + bad.map(displayNo).join(", ")); return; }
  ev.uploadReady = true;
  saveQuiet();
  render();
  eventCompleteDone(ev);
};
window.markEventUpload = markEventUpload;

function cocTemplateBytes() {
  const bin = atob(COC_TEMPLATE_V34_B64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
function cocDate(iso) {
  const s = String(iso || "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.split("-").reverse().join("/");
  const d = new Date(s);
  if (!s || isNaN(d)) return "";

<script>
/* ===== v44d: photos out of the record / localStorage (John, 3 Nov 2026: "Do the photo storage fix now").
   Every photo (filter photo t.photo, equipment-damage photo t.equipPhoto, daily log pages t.dailyLog.photos) is shrunk
   (long edge 1600 px, JPEG 0.7), stored as a Blob in IndexedDB ("envss-field-photos"), and uploaded in the background to the
   PRIVATE Supabase bucket "field-photos" (anon may only INSERT, never read/list/replace/delete).
   The sample record keeps a small reference only:
     t.photo / t.equipPhoto = "envss-photo:<pid>", with t.photoRefs[pid] = { pid, path, bytes, w, h, takenAt, uploaded, field }
     t.dailyLog.photos[i]   = { pid, path, bytes, w, h, takenAt, uploaded }

   survives reload/offline, one audit line per photo on the first failure (no spam). Uploaded blobs are pruned 30 days after
   upload; a blob that is not uploaded is never pruned. Old inline data: photos are moved to IndexedDB on load and the inline
   data is replaced only after the IndexedDB write succeeds; the normal sync then pushes the slimmer record. ===== */

      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  async function count() { try { pending = (await all()).filter(r => !r.uploaded && !r.removed).length; } catch (e) { pending = 0; } try { paintSyncBar(); } catch (e) {} return pending; }

          if (typeof v === "string" && v.startsWith("data:image")) { try { const ref = await add(v, t, field, t.updatedAt); t.photoRefs = Object.assign({}, t.photoRefs, { [ref.pid]: Object.assign({ field }, ref) }); t[field] = PFX + ref.pid; n++; } catch (e) { console.warn("[ENVSS] migrate", e); } } }

        if (n > n0) { t.updatedAt = nowIso(); t.audit = t.audit || []; t.audit.push({ at: nowIso(), who: whoText(), action: "Photos moved to device photo storage", field: "photo", from: "", to: "", detail: (n - n0) + " inline photo(s) replaced by references; upload queued" }); }

  paintSyncBar = function () { const r = _psb.apply(this, arguments); try { const el = document.getElementById("syncBar"); if (el && pending) { const s = document.createElement("div"); s.className = "photo-q"; s.id = "photoQueue";
    s.textContent = "Photos: " + pending + " waiting to upload" + (navigator.onLine ? "" : " (offline — kept on this device)"); el.appendChild(s); } } catch (e) {} return r; };

  signOut = function () { if (pending && !confirm(pending + " photo" + (pending === 1 ? " is" : "s are") + " still waiting to upload. They stay on this device and upload when online, but do not clear this browser's site data until they have gone.\n\nSign out anyway?")) return; return _so.apply(this, arguments); };
  window.signOut = signOut;
  window.addEventListener("beforeunload", e => { if (pending && !navigator.onLine) { e.preventDefault(); e.returnValue = ""; } });
  /* a sample screen photo value of "envss-photo:<pid>" renders as a placeholder img that hydrate() fills from IndexedDB */
  const _th = trainHtml;
  trainHtml = function () { const html = _th.apply(this, arguments); return typeof html === "string" ? html.replace(/<img alt="(filter|equipment)" src="envss-photo:([0-9a-f-]+)"[^>]*>/g, (m, a, pid) => imgTag(pid, a)) : html; };

  window.render = render;

  window.mergeRemote = mergeRemote;
  window.addEventListener("online", () => { (async () => { for (const r of await all().catch(() => [])) if (!r.uploaded) { r.nextAt = 0; await put(r); } run(); })(); });
  window.addEventListener("offline", () => count());
  setInterval(run, 60e3);
  /* export: storage paths of the filter / equipment photos ("filter: p/…jpg; equipment: p/…jpg") */
  window.envssPhotoPaths = t => [["photo", "filter"], ["equipPhoto", "equipment"]].map(([k, l]) => { const v = t[k]; if (!v) return ""; if (String(v).startsWith(PFX)) { const m = metaFor(t, String(v).slice(PFX.length)); return l + ": " + (m ? m.path : "local"); } return l + ": inline (not yet moved)"; }).filter(Boolean).join("; ");
  window.envssPhotos = { add, attach, discard, imgTag, hydrate, run, count, migrate, prune, all, pending: () => pending, pathOf: pid => { for (const t of db.trains || []) { const m = metaFor(t, pid); if (m) return m.path; } return ""; } };
  const st = document.createElement("style"); st.textContent = ".photo-q{margin-top:4px;font-weight:700;color:#FFC266}.photo-ph{display:inline-block;padding:10px 12px;border:1px dashed #6B7590;border-radius:8px;color:#B4BBCC;font-size:13px;max-width:220px}";
  document.head.appendChild(st);
  (async () => { await migrate(); await prune(); await count(); run(); })();

<script>
/* ===== v44c: Daily log (worker's paper "Personal Sampling Field Sheet") on PERSONAL samples (airborne + noise; not static,
   blanks or AFM). Status: attached (photo pages) / not_supplied / to_follow. Purely informational: it is NOT in answerItems,
   so it never changes the sample status or the "still to answer" count. Photos use the same storage as the existing sample
   photos (data URL kept on the sample record, synced with the record), but are shrunk first (long edge 1600 px, JPEG 0.7).
   One log can cover all of a worker's samples that shift: other samples keep a reference (dailyLog.ref) to the sample that
   holds the pages, so the photos are stored once. Changes go in each sample's audit log. ===== */
(function () {
  const ST = { attached: "Photo attached", not_supplied: "Not supplied", to_follow: "To follow" };
    function wantsLog(t) { return !!t && !isBlank(t) && !isFibreTrain(t) && !isStatic(t); }
  function dl(t) { return t.dailyLog || {}; }
  function src(t) { const d = dl(t); return d.ref ? (db.trains.find(x => x.id === d.ref) || null) : t; }
  function pages(t) { const s = src(t); return (s && dl(s).photos) || []; }
  function statusOf(t) { const d = dl(t); if (d.status === "attached" && !pages(t).length) return "to_follow"; return d.status || ""; }
  function personKey(t) { const p = t.person || {}; const n = [p.first, p.last].map(x => String(x || "").trim().toLowerCase()); return n[0] && n[1] ? n.join(" ") : ""; }
  function dayKey(t) { return t.shiftDate || (eventById(t.eventId) || {}).date || ""; }
  function siblings(t) { const k = personKey(t); if (!k) return []; return trainsOf(t.eventId).filter(x => x !== t && wantsLog(x) && personKey(x) === k && dayKey(x) === dayKey(t)); }
  function log(t, action, from, to, detail) { t.audit = t.audit || []; t.audit.push({ at: nowIso(), who: whoText(), action, field: "dailyLog", from: from || "", to: to || "", detail: detail || "" }); }
  function setStatus(t, s, why) {
    const was = statusOf(t); t.dailyLog = Object.assign({}, dl(t), { status: s, at: nowIso(), who: whoText() });
    if (s !== "attached") { delete t.dailyLog.ref; }
    if (was !== s) log(t, "Changed Daily log", ST[was] || "", ST[s], why || "");
    t.updatedAt = nowIso();
  }
  async function addPhotos(t, files) {
    if (!files || !files.length) return;
    let s = src(t); if (!s || s !== t) { s = t; }   // adding pages on a sample that referenced another: this sample becomes a holder
    s.dailyLog = Object.assign({}, dl(s)); delete s.dailyLog.ref; s.dailyLog.photos = (s.dailyLog.photos || []).slice();
    for (const f of files) { try { const p = await envssPhotos.add(f, s, "dailyLog"); p.at = p.takenAt; s.dailyLog.photos.push(p); } catch (e) { console.warn("v44c photo", e); } }   /* v44d: reference only, blob in IndexedDB */
    setStatus(s, "attached");
    log(s, "Daily log photo added", "", s.dailyLog.photos.length + " page(s)", files.length + " added, " + Math.round(s.dailyLog.photos.reduce((a, p) => a + p.bytes, 0) / 1024) + " KB total");
    save(); render(); setTimeout(offerSiblings, 50);
  }
  function applyToSiblings(t) {
    const sibs = siblings(t), s = statusOf(t); if (!sibs.length || !s) return 0;
    sibs.forEach(x => { const was = statusOf(x);
      x.dailyLog = s === "attached" ? { status: "attached", ref: (src(t) || t).id, at: nowIso(), who: whoText() } : { status: s, at: nowIso(), who: whoText() };
      log(x, "Changed Daily log", ST[was] || "", ST[s], "Applied from " + displayNo(t) + (s === "attached" ? " (same field sheet, " + pages(t).length + " page(s) held on " + displayNo(src(t) || t) + ")" : ""));
      x.updatedAt = nowIso(); });
    save(); return sibs.length;
  }
  function chip(t) { const s = statusOf(t); const cls = s === "attached" ? "dl-ok" : "dl-warn";
    return `<span class="dl-chip ${cls}">Daily log: ${s ? ST[s].toLowerCase().replace("photo attached", "attached" + (pages(t).length ? " (" + pages(t).length + ")" : "")) : "not asked"}</span>`; }
  function cardHtml(t) {
    const s = dl(t).status || "", ps = pages(t), holder = src(t), sibs = siblings(t);   /* s = what was picked; statusOf() = effective (attached with no pages counts as to follow) */
    const opt = (k) => `<button type="button" class="chip dl-opt ${s === k ? "on" : ""}" data-dl="${k}">${ST[k]}</button>`;
    return `<div class="card dl-card" id="dailyLogCard">
      <div class="row" style="justify-content:space-between;align-items:center;gap:8px"><h3 class="brand-type" style="margin:0">Daily log</h3>${chip(t)}</div>
      <p class="help">Worker's Personal Sampling Field Sheet. Optional: it never holds up the sample.</p>
      <div class="filters">${opt("attached")}${opt("not_supplied")}${opt("to_follow")}</div>
      <div class="dl-photos">${ps.map((p, i) => `<figure>${envssPhotos.imgTag(p, "Daily log page " + (i + 1))}<figcaption>p${i + 1}${holder === t ? ` <button type="button" class="dl-del" data-dldel="${i}" aria-label="Remove page ${i + 1}">✕</button>` : ""}</figcaption></figure>`).join("")}</div>
      ${holder && holder !== t ? `<p class="help">Pages held on ${esc(displayNo(holder))} (same worker, same shift).</p>` : ""}
      <div class="dl-add" style="${s === "attached" ? "" : "display:none"}">
        <label class="btn ghost dl-btn">📷 Take photo<input type="file" accept="image/*" capture="environment" id="dlCam" hidden></label>
        <label class="btn ghost dl-btn">Choose pages<input type="file" accept="image/*" multiple id="dlFiles" hidden></label>
      </div>
      ${sibs.length && s ? `<button type="button" class="btn ghost dl-btn" id="dlSibs" style="width:100%;margin-top:8px">Apply to this person's other samples today (${sibs.length})</button>` : ""}
      <div class="pump-note" id="dlNote"></div>
    </div>`;
  }
  function cur() { return view.page === "train" ? db.trains.find(x => x.id === view.trainId) : null; }
  function offerSiblings() { const b = document.getElementById("dlSibs"); if (b) { b.classList.add("q-flash"); setTimeout(() => b.classList.remove("q-flash"), 1200); } }
  function wireCard(t) {
    const card = document.getElementById("dailyLogCard"); if (!card) return;
    card.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => {
      const k = b.dataset.dl; setStatus(t, k); save(); render();
      if (k === "attached" && !pages(t).length) setTimeout(() => { const i = document.getElementById("dlCam"); if (i) i.click(); }, 50);
      else setTimeout(offerSiblings, 50);
    });
    ["dlCam", "dlFiles"].forEach(id => { const i = document.getElementById(id); if (i) i.onchange = () => addPhotos(t, Array.from(i.files || [])); });
    card.querySelectorAll("[data-dldel]").forEach(b => b.onclick = () => {
      if (!confirm("Remove daily log page " + (Number(b.dataset.dldel) + 1) + "?")) return;
      const ps = dl(t).photos || []; const gone = ps.splice(Number(b.dataset.dldel), 1)[0]; if (gone && gone.pid) envssPhotos.discard(gone.pid); log(t, "Daily log photo removed", "", ps.length + " page(s)", "");
      if (!ps.length) setStatus(t, "to_follow", "last page removed"); save(); render(); });
    const sb = document.getElementById("dlSibs");
    if (sb) sb.onclick = () => { const n = applyToSiblings(t); render(); const note = document.getElementById("dlNote"); if (note) note.textContent = "Applied to " + n + " other sample" + (n === 1 ? "" : "s") + "."; };
  }
  function eventSummary(ev) {
    const ts = trainsOf(ev.id).filter(wantsLog); if (!ts.length) return "";
    const c = { attached: 0, not_supplied: 0, to_follow: 0, "": 0 }; ts.forEach(t => c[statusOf(t)]++);
    const parts = [c.attached + " of " + ts.length + " attached"]; if (c.to_follow) parts.push(c.to_follow + " to follow"); if (c.not_supplied) parts.push(c.not_supplied + " not supplied"); if (c[""]) parts.push(c[""] + " not asked");
    return `<p class="dl-sum ${c.attached === ts.length ? "ok" : ""}" id="dailyLogSummary">Daily logs: ${parts.join(", ")}</p>`;
  }
  /* STOP reminder: gentle, non-blocking bottom sheet */
  function remind(t) {
    const old = document.getElementById("dlRemind"); if (old) old.remove();
    const d = document.createElement("div"); d.id = "dlRemind"; d.className = "dl-remind"; d.setAttribute("role", "status");
    d.innerHTML = `<div><strong>Collect daily log</strong> from ${esc([(t.person || {}).first, (t.person || {}).last].filter(Boolean).join(" ") || displayNo(t))}</div>
      <div class="dl-rbtns"><button type="button" class="btn" data-r="photo">📷 Take photo</button><button type="button" class="btn ghost" data-r="not_supplied">Not supplied</button><button type="button" class="btn ghost" data-r="later">Later</button></div>`;
    document.body.appendChild(d);
    const close = () => d.remove(); const timer = setTimeout(close, 20000);
    d.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { clearTimeout(timer); close(); const r = b.dataset.r;
      if (r === "photo") { setStatus(t, "attached"); save(); render(); setTimeout(() => { const i = document.getElementById("dlCam"); if (i) i.click(); }, 50); }
      else { setStatus(t, r === "later" ? "to_follow" : "not_supplied", "at STOP"); save(); render(); } });
  }
  let pre = null;
  document.addEventListener("click", e => { if (e.target.closest && e.target.closest("#btnStop")) { const t = cur(); pre = t ? { id: t.id, endAt: t.endAt } : null; } }, true);
  document.addEventListener("click", e => { if (!(e.target.closest && e.target.closest("#btnStop")) || !pre) return; const p = pre; pre = null;
    setTimeout(() => { const t = db.trains.find(x => x.id === p.id); if (t && wantsLog(t) && t.endAt && t.endAt !== p.endAt && statusOf(t) !== "attached" && statusOf(t) !== "not_supplied") remind(t); }, 150); });
  const _render44c = render;
  render = function () {
    const r = _render44c.apply(this, arguments);
    try {
      const t = cur();
      if (t && wantsLog(t) && !document.getElementById("dailyLogCard")) {
        /* v44d (John): at the bottom of the sample screen, after all fields/sections, above Delete sample / the audit log */
        const before = document.querySelector("#app .footer-actions #btnDelete") ? document.querySelector("#app .footer-actions #btnDelete").closest(".footer-actions") : document.getElementById("auditToggle");
        if (before) before.insertAdjacentHTML("beforebegin", cardHtml(t));
        else { const w = document.querySelector("#app .wrap") || document.getElementById("app"); if (w) w.insertAdjacentHTML("beforeend", cardHtml(t)); }
        wireCard(t);
      }
      if (view.page === "event") { const ev = eventById(view.eventId);
        if (ev && !isFibreEvent(ev)) {

          if (f) f.insertAdjacentHTML("beforebegin", eventSummary(ev));

            if (t2 && wantsLog(t2) && !row.querySelector(".dl-chip") && statusOf(t2) !== "attached" && (t2.endAt || statusOf(t2))) { const h = row.querySelector(".row-title") || row; h.insertAdjacentHTML("beforeend", " " + chip(t2)); } });
        } }
    } catch (e) { console.warn("v44c daily log", e); }
    return r;
  };
  window.render = render;
  window.v44DailyLog = { statusOf, pages, label: t => (wantsLog(t) ? (statusOf(t) || "not_asked") : ""),
    ref: t => { if (!wantsLog(t) || statusOf(t) !== "attached") return ""; const s = src(t) || t; return pages(t).map(p => p.path || ("local:" + p.pid)).join("; ") + (s === t ? "" : " (held on " + displayNo(s) + ")"); } };
  const st = document.createElement("style"); st.textContent =
    ".dl-card{margin-top:12px}.dl-chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid #6B5A2E;background:#2A2412;color:#E8D9A8;white-space:nowrap}" +
    ".dl-chip.dl-ok{border-color:#2F6B55;background:#11281F;color:#9FE0C4}.dl-opt{min-height:44px}.dl-photos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}" +
    ".dl-photos figure{margin:0;width:96px}.dl-photos img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--edge,#3A4A7A)}" +
    ".dl-photos figcaption{font-size:12px;display:flex;justify-content:space-between;align-items:center}.dl-del{min-width:32px;min-height:32px;background:transparent;color:inherit;border:1px solid var(--edge,#3A4A7A);border-radius:8px}" +
    ".dl-add{display:flex;gap:8px;flex-wrap:wrap}.dl-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;flex:1 1 140px;cursor:pointer}" +
    ".dl-sum{margin:6px 0;font-size:14px;font-weight:700;color:#E8D9A8}.dl-sum.ok{color:#9FE0C4}" +

    ".dl-rbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.dl-rbtns .btn{min-height:44px;flex:1 1 100px;font-size:15px}";
  document.head.appendChild(st);
  render();
})();

  function ensureHires() {
    if (!Array.isArray(db.hires)) db.hires = [];
    return db.hires;
  }

  function hireById(id) {
    return ensureHires().find(function (h) { return h && h.id === id; }) || null;
  }

  function latestHires() {
    return ensureHires().filter(function (h) { return h && h.is_latest !== false; })
      .sort(function (a, b) { return String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")); });
  }

  function versionsOf(groupId) {
    return ensureHires().filter(function (h) { return h && h.request_group_id === groupId; })
      .sort(function (a, b) { return (b.version || 0) - (a.version || 0); });
  }

  function activeJobs() {
    return (db.projects || []).filter(function (p) {
      if (!p) return false;
      try { return typeof activeProject === "function" ? activeProject(p) : true; } catch (e) { return true; }
    }).sort(function (a, b) { return String(b.number || "").localeCompare(String(a.number || "")); });
  }

  function jobByNumber(num) {
    var n = String(num || "").trim();
    if (!n) return null;
    return (db.projects || []).find(function (p) { return String(p.number || "") === n; }) || null;
  }

  function defaultRequester() {
    var o = getOperator();
    if (o && (o.name || o.email)) return o.email ? (o.name + " <" + o.email + ">") : o.name;
    try {
      var sess = getSession();
      if (sess && sess.user) {
        var u = sess.user;
        return u.email ? ((u.name || u.email) + " <" + u.email + ">") : (u.name || "");
      }
    } catch (e) {}
    return whoText();
  }

  function supplierName(id) {
    var s = HIRE_CATALOG.suppliers.find(function (x) { return x.id === id; });
    return s ? s.name : id;
  }

  function itemsFor(supplierId) {
    return (HIRE_CATALOG.items[supplierId] || []).slice();
  }

  function blankLine() {
    return { catalog_key: "", label: "", quantity: 1, is_free_text: false, flagged: false };
  }

  function blankDraft(base) {
    var o = {
      id: "",
      request_group_id: "",
      version: 1,
      is_latest: true,
      supplier: "air-met",
      ref_type: "job",
      job_number: "",
      lead_number: "",
      project_id: "",
      on_hire_date: "",
      off_hire_date: "",
      logistics: "delivery",
      delivery_site: "",
      requested_by: defaultRequester(),
      lines: [blankLine()],
      createdAt: "",
      updatedAt: "",
      source: "field"
    };
    if (base) {
      Object.keys(base).forEach(function (k) { if (base[k] !== undefined) o[k] = base[k]; });
      o.lines = (base.lines || [blankLine()]).map(function (ln) {
        return {
          catalog_key: ln.catalog_key || "",
          label: ln.label || "",
          quantity: Number(ln.quantity) || 1,
          is_free_text: !!ln.is_free_text,
          flagged: !!ln.flagged
        };
      });
    }
    return o;
  }

    view.page = "hireList";

    view.hireDraft = null;
    render();

  function openHireNew() {
    view.page = "hireForm";
    view.hireId = null;
    view.hireDraft = blankDraft();
    view.hireDraft.request_group_id = uid("hg");
    view.hireMode = "new";
    render();

  function openHireEdit(id) {
    var h = hireById(id);
    if (!h) { alert("Hire request not found on this device."); return; }
    view.page = "hireForm";
    view.hireId = id;
    view.hireDraft = blankDraft(h);
    view.hireMode = "version"; /* saving creates a new linked version */
    render();
  }

    html += "<button class=\"btn orange\" type=\"button\" id=\"btnHireNew\">New hire request</button></div>";
    if (!list.length) {
      html += "<div class=\"empty\">No hire requests on this device yet.</div>";
    } else {
      list.forEach(function (h) {
        var ref = h.ref_type === "lead"
          ? ("Lead " + (h.lead_number || "—"))
          : ("Job " + (h.job_number || "—"));
        var lines = (h.lines || []).map(function (ln) { return (ln.quantity || 1) + "× " + (ln.label || "(blank)"); }).join(", ");
        var flag = (h.lines || []).some(function (ln) { return ln.flagged || ln.is_free_text; });
        html += "<button type=\"button\" class=\"card open-hire\" data-hire=\"" + esc(h.id) + "\" style=\"display:block;width:100%;text-align:left\">";
        html += "<div class=\"row\"><div class=\"grow\">";
        html += "<div class=\"brand-type\" style=\"font-weight:700;color:var(--navy);font-size:17px\">" + esc(supplierName(h.supplier)) + " · " + esc(ref) + "</div>";
        html += "<div class=\"muted\">v" + (h.version || 1) + (flag ? " · free-text flagged" : "") + " · " + esc(h.logistics || "") + "</div>";
        html += "<div class=\"muted\">" + esc(lines || "No lines") + "</div>";
        html += "<div class=\"muted\">" + esc(h.on_hire_date || "?") + " → " + esc(h.off_hire_date || "?") + " · " + esc(h.requested_by || "") + "</div>";
        html += "</div></div></button>";
      });
    }
    html += "<p class=\"help\">ENVSS Field v" + APP_VERSION + " · hire (local unpublished). Opening a request and saving creates a new version.</p>";

    return html;

  function lineHtml(ln, i, items) {
    var free = !!ln.is_free_text || (!ln.catalog_key && !!ln.label);
    var html = "<div class=\"card hire-line\" data-line=\"" + i + "\" style=\"margin:8px 0\">";
    html += "<div class=\"row\"><div class=\"grow brand-type\" style=\"font-weight:700;color:var(--navy)\">Line " + (i + 1) + "</div>";
    html += "<button type=\"button\" class=\"btn ghost hire-remove-line\" data-line=\"" + i + "\">Remove</button></div>";
    html += "<label>Equipment</label><select class=\"hire-equip\" data-line=\"" + i + "\">";
    html += "<option value=\"\">Select…</option>";
    items.forEach(function (it) {
      html += "<option value=\"" + esc(it.key) + "\"" + (ln.catalog_key === it.key ? " selected" : "") + ">"
        + esc(it.label) + (it.pending ? " *" : "") + "</option>";
    });
    html += "<option value=\"__free__\"" + (free && !ln.catalog_key ? " selected" : "") + ">Free text (not in catalog — flagged)</option>";
    html += "</select>";
    html += "<label>Label (exact invoice/quote wording)</label>";
    html += "<input class=\"hire-label\" data-line=\"" + i + "\" value=\"" + esc(ln.label || "") + "\" " + (ln.catalog_key && !free ? "readonly" : "") + " placeholder=\"Required\">";
    html += "<label>Quantity</label><input type=\"number\" min=\"1\" step=\"1\" class=\"hire-qty\" data-line=\"" + i + "\" value=\"" + esc(String(ln.quantity || 1)) + "\">";
    if (ln.rateNote && !free) html += "<p class=\"help\">" + esc(ln.rateNote) + "</p>";
    if (ln.flagged || free) html += "<p class=\"help\" style=\"color:var(--hot,#FFB066)\">Flagged for later catalog update.</p>";
    html += "</div>";
    return html;
  }

  function readDraftFromDom() {
    var d = view.hireDraft || blankDraft();
    var sup = document.getElementById("hireSupplier");
    if (sup) d.supplier = sup.value;
    var on = document.getElementById("hireOn");
    if (on) d.on_hire_date = on.value;
    var off = document.getElementById("hireOff");
    if (off) d.off_hire_date = off.value;
    var log = document.getElementById("hireLogistics");
    if (log) d.logistics = log.value;
    var site = document.getElementById("hireSite");
    if (site) d.delivery_site = site.value.trim();
    var who = document.getElementById("hireWho");
    if (who) d.requested_by = who.value.trim();
    if (d.ref_type === "job") {
      var job = document.getElementById("hireJob");
      if (job) {
        d.job_number = (job.value || "").trim();
        var opt = job.options[job.selectedIndex];
        d.project_id = opt && opt.getAttribute("data-pid") || "";
        d.lead_number = "";
      }
    } else {
      var lead = document.getElementById("hireLead");
      if (lead) d.lead_number = lead.value.trim();
      d.job_number = "";
      d.project_id = "";
    }
    var lines = [];
    document.querySelectorAll("#hireLines .hire-line").forEach(function (card) {
      var i = card.getAttribute("data-line");
      var eq = card.querySelector(".hire-equip");
      var lab = card.querySelector(".hire-label");
      var qty = card.querySelector(".hire-qty");
      var key = eq ? eq.value : "";
      var label = lab ? lab.value.trim() : "";
      var isFree = key === "__free__" || (!key && !!label);
      var catalogKey = isFree ? "" : key;
      if (!isFree && catalogKey) {
        var it = itemsFor(d.supplier).find(function (x) { return x.key === catalogKey; });
        if (it && !label) label = it.label;
      }
      var prev = (d.lines || [])[lines.length] || {};
      var catIt = (!isFree && catalogKey) ? itemsFor(d.supplier).find(function (x) { return x.key === catalogKey; }) : null;
      lines.push({
        catalog_key: catalogKey,
        label: label,
        quantity: Math.max(1, parseInt(qty && qty.value, 10) || 1),
        is_free_text: isFree,
        flagged: isFree || !!(catIt && catIt.pending),
        catalog_code: catIt && catIt.catalog_code ? catIt.catalog_code : (prev.catalog_code || ""),
        rates: catIt && catIt.rates ? catIt.rates : (isFree ? null : (prev.rates || null)),
        rateNote: catIt && catIt.rateNote ? catIt.rateNote : (isFree ? "" : (prev.rateNote || ""))
      });
    });
    if (lines.length) d.lines = lines;
    view.hireDraft = d;
    return d;
  }

  function validate(d) {
    if (!d.supplier || !HIRE_CATALOG.suppliers.some(function (s) { return s.id === d.supplier && s.enabled; })) {
      return "Choose an enabled supplier (Air-Met or NVMS).";
    }
    if (d.ref_type === "job") {
      if (!String(d.job_number || "").trim()) return "Pick a job from the active project list.";
      var jp = (db.projects || []).find(function (p) { return String(p.number || "") === String(d.job_number); });
      if (!jp) return "Pick a job from the active project list (jobs come from envss_projects; do not type a fake job).";
      /* Prefer seven-digit Podio job numbers; field-created projects may differ and are still allowed once picked. */
      if (!/^\d{7}$/.test(String(d.job_number)) && (!jp.source || jp.source === "podio")) {
        return "Podio jobs use a seven-digit job number. Check the selected project.";
      }
    } else if (d.ref_type === "lead") {
      if (!String(d.lead_number || "").trim()) return "Enter the unique lead number.";
    } else return "Choose Job or Lead.";
    if (!d.on_hire_date) return "Enter the on-hire date.";
    if (!d.off_hire_date) return "Enter the off-hire date.";
    if (d.off_hire_date < d.on_hire_date) return "Off-hire date must be on or after on-hire date.";
    if (!d.logistics) return "Choose logistics.";
    if (!d.requested_by) return "Who requested it is required.";
    if (!d.lines || !d.lines.length) return "Add at least one equipment line.";
    for (var i = 0; i < d.lines.length; i++) {
      var ln = d.lines[i];
      if (!ln.label || !String(ln.label).trim()) return "Line " + (i + 1) + " needs a label (exact wording or free text).";
      if (!(Number(ln.quantity) >= 1)) return "Line " + (i + 1) + " needs a quantity of at least 1.";
    }
    return "";
  }

  function saveHireRequest() {
    var d = readDraftFromDom();
    var err = validate(d);
    if (err) { alert(err); return; }
    var now = nowIso();
    var mode = view.hireMode === "version" ? "version" : "new";
    ensureHires();

    if (mode === "version") {
      var prev = hireById(view.hireId);
      if (!prev) { alert("Original request missing."); return; }
      /* Mark all previous versions in the group as not latest */
      versionsOf(prev.request_group_id).forEach(function (h) {
        if (h.is_latest) { h.is_latest = false; h.updatedAt = now; }
      });
      var next = blankDraft(d);
      next.id = uid("hr");
      next.request_group_id = prev.request_group_id;
      next.version = (prev.version || 1) + 1;
      next.is_latest = true;
      next.createdAt = now;
      next.updatedAt = now;
      next.parent_id = prev.id;
      db.hires.push(next);
    } else {
      var rec = blankDraft(d);
      rec.id = uid("hr");
      rec.request_group_id = d.request_group_id || uid("hg");
      rec.version = 1;
      rec.is_latest = true;
      rec.createdAt = now;
      rec.updatedAt = now;
      db.hires.push(rec);
    }
    /* Never write Podio project rows from hire save */
    save();
    openHireList();
  }

  /* ---- wire into render / dash / bind ---- */
  var _dashHire = dashHtml;
  dashHtml = function () {
    var html = _dashHire();
    /* Insert Hire entry near the top actions without requiring a project */
    if (html.indexOf("id=\"btnHireRequests\"") >= 0) return html;
    html = html.replace(
      /(<div class="row"><h2 class="brand-type"[^>]*>Active projects<\/h2><button class="btn orange" id="btnNewProject">New project<\/button><\/div>)/,
      "$1<div class=\"row\" style=\"margin:10px 0 4px;gap:8px;flex-wrap:wrap\">"
        + "<button type=\"button\" class=\"btn mid\" id=\"btnHireRequests\">Hire requests</button>"
        + "<span class=\"help\" style=\"margin:0;align-self:center\">Jobs and leads — no project required to start.</span></div>"
    );
    /* Fallback if markup differs */
    if (html.indexOf("id=\"btnHireRequests\"") < 0) {
      html = html.replace(
        "<div class=\"wrap\">",
        "<div class=\"wrap\"><div class=\"row\" style=\"margin:0 0 10px\"><button type=\"button\" class=\"btn mid\" id=\"btnHireRequests\">Hire requests</button></div>"
      );
    }
    return html;
  };

  var _renderHire = render;
  render = function () {
    if (view.page === "hireList" || view.page === "hireForm") {
      setOnline();
      var whoEl = document.getElementById("whoLabel");
      if (whoEl) whoEl.textContent = whoText();
      paintLogin();
      var root = document.getElementById("app");
      if (tickMin) { clearInterval(tickMin); tickMin = null; }
      root.innerHTML = view.page === "hireList" ? hireListHtml() : hireFormHtml();
      bindHire();
      paintSyncBar();
      return;
    }
    var r = _renderHire.apply(this, arguments);
    /* After normal dash bind, attach hire button if present */
    var btn = document.getElementById("btnHireRequests");
    if (btn) btn.onclick = function () { openHireList(); };
    return r;
  };

  var _bindHire = bind;
  bind = function () {
    try { _bindHire.apply(this, arguments); } catch (e) {}
    var btn = document.getElementById("btnHireRequests");
    if (btn) btn.onclick = function () { openHireList(); };
  };

  function bindHire() {
    var backDash = document.getElementById("btnHireBackDash");
    if (backDash) backDash.onclick = function () { goDash(); };
    var backList = document.getElementById("btnHireBackList");
    if (backList) backList.onclick = function () { readDraftFromDom(); openHireList(); };
    var neu = document.getElementById("btnHireNew");
    if (neu) neu.onclick = function () { openHireNew(); };
    document.querySelectorAll(".open-hire").forEach(function (btn) {
      btn.onclick = function () { openHireEdit(btn.getAttribute("data-hire")); };
    });
    var cancel = document.getElementById("btnHireCancel");
    if (cancel) cancel.onclick = function () { openHireList(); };
    var saveBtn = document.getElementById("btnHireSave");
    if (saveBtn) saveBtn.onclick = function () { saveHireRequest(); };
    var add = document.getElementById("btnHireAddLine");
    if (add) add.onclick = function () {
      var d = readDraftFromDom();
      d.lines.push(blankLine());
      view.hireDraft = d;
      render();
    };
    document.querySelectorAll(".hire-remove-line").forEach(function (btn) {
      btn.onclick = function () {
        var d = readDraftFromDom();
        var i = parseInt(btn.getAttribute("data-line"), 10);
        if (d.lines.length <= 1) { alert("Keep at least one equipment line."); return; }
        d.lines.splice(i, 1);
        view.hireDraft = d;
        render();
      };
    });
    document.querySelectorAll("[data-hire-ref]").forEach(function (btn) {
      btn.onclick = function () {
        var d = readDraftFromDom();
        d.ref_type = btn.getAttribute("data-hire-ref");
        if (d.ref_type === "job") d.lead_number = "";
        else { d.job_number = ""; d.project_id = ""; }
        view.hireDraft = d;
        render();
      };
    });
    var sup = document.getElementById("hireSupplier");
    if (sup) sup.onchange = function () {
      var d = readDraftFromDom();
      d.supplier = sup.value;
      /* Clear catalog keys that don't belong to the new supplier; keep free-text labels */
      d.lines.forEach(function (ln) {
        if (ln.catalog_key) {
          var ok = itemsFor(d.supplier).some(function (it) { return it.key === ln.catalog_key; });
          if (!ok) { ln.catalog_key = ""; ln.is_free_text = true; ln.flagged = true; }
        }
      });
      view.hireDraft = d;
      render();
    };
    document.querySelectorAll(".hire-equip").forEach(function (sel) {
      sel.onchange = function () {
        var d = readDraftFromDom();
        var i = parseInt(sel.getAttribute("data-line"), 10);
        var ln = d.lines[i];
        if (!ln) return;
        if (sel.value === "__free__" || !sel.value) {
          ln.catalog_key = "";
          ln.is_free_text = true;
          ln.flagged = true;
          ln.catalog_code = "";
          ln.rates = null;
          ln.rateNote = "";
        } else {
          var it = itemsFor(d.supplier).find(function (x) { return x.key === sel.value; });
          ln.catalog_key = sel.value;
          ln.label = it ? it.label : ln.label;   /* exact item_name — never rewrite */
          ln.is_free_text = false;
          ln.flagged = !!(it && it.pending);
          ln.catalog_code = it && it.catalog_code ? it.catalog_code : "";
          ln.rates = it && it.rates ? it.rates : null;   /* reference only; no billing maths in v1 */
          ln.rateNote = it && it.rateNote ? it.rateNote : "";
        }
        view.hireDraft = d;
        render();
      };
    });
  }

  window.openHireList = openHireList;
  window.openHireNew = openHireNew;
  window.openHireEdit = openHireEdit;
  window.envssHire = {
    catalog: HIRE_CATALOG,
    list: latestHires,
    openList: openHireList,
    openNew: openHireNew,
    openEdit: openHireEdit
  };
})();

</script>
</body>
</html>
